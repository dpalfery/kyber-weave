[package]
name = "kyberdash-tray"
version = "0.1.0"
description = "KyberDash menu-bar / notification-area tray"
authors = ["Dave Palfery"]
edition = "2021"
license = "MIT"
# Bundled as darwin-arm64, darwin-x64 and win-x64 (requirement 6.1).
rust-version = "1.77"

[lib]
name = "kyberdash_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kyberdash-tray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
dirs = "6"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "process", "io-util", "time", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
