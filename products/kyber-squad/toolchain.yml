schema: kyber-squad.toolchain/v1
required-features: []
# The MCP tools canonical agents are entitled to call, declared per server.
#
# This roster lives in source rather than in a renderer because it is an external contract
# that drifts: context7 renamed `get-library-docs` to `query-docs`, and a harness whose tool
# allow-list matches by exact name breaks on a rename rather than degrading. Keeping it here
# means a rename is a one-line source edit, and means the renderer and `squad doctor` read
# the same list instead of two copies that can disagree.
#
# Verified 2026-09-21 by listing each server's tools over MCP — codegraph (`codegraph serve
# --mcp`) and context7 4.1.1 (https://mcp.context7.com/mcp). That listing did not cover the
# kw-docs roster below, whose newest entries (`docs_get_coding_standard_for_technology`,
# `docs_get_source_repository_and_revision`) post-date it, so it still speaks for those two
# servers and not for this one. kw-docs is pinned mechanically instead, by
# SquadToolchainRosterGuardTests.ShippedToolchainRosterGrantsEveryToolTheKyberWeaveMcpServerExposes
# in that class: the guard reads the exposed
# `[McpServerTool]` names off DocsTools and fails when any of them is missing here. A roster
# that is merely short reports nothing on its own, which is why the absence of
# `docs_get_source_repository_and_revision` went unnoticed until the guard existed.
required-mcp-tools:
  codegraph:
    - codegraph_explore
  context7:
    - resolve-library-id
    - query-docs
  kw-docs:
    - docs_answer_question_from_repo_documentation
    - docs_archive_plan_after_closeout_is_complete
    - docs_detect_drift_between_documents_and_code
    - docs_find_documents_citing_code_symbol
    - docs_finalize_approved_plan_and_write_task_file
    - docs_find_duplicates_conflicts_ambiguous_terms
    - docs_get_coding_standard_for_technology
    - docs_get_source_repository_and_revision
    - docs_look_up_glossary_term_definition
    - docs_validate_governed_document_schema
  kw-arbiter:
    - arbiter_check_configuration_and_key_readiness
    - arbiter_classify_bot_review_comment
    - arbiter_evaluate_agent_dispatch_or_return
    - arbiter_list_effective_rules_by_trigger
    - arbiter_select_relevant_document_sections
validated-release: null
