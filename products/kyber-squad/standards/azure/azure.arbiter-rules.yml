# Machine rules the Arbiter evaluates for the 'azure' folder.
#
# AZURE-READONLY-001 is the command allow-list for a dispatch whose capability profile can run
# commands but not write files (platform-reader, which platform-researcher uses). A command
# whose form is one of the listed read forms is allowed; any other `az` command is refused
# where the worker guard sees the call (Claude Code and Copilot CLI) and is an instruction
# only on the other harnesses, where the same forms are stated in azure.rules.md.
#
# A folder that declares no rule refuses nothing: an event with no matching rule leaves the
# command alone, and an answer the Arbiter cannot reach allows (ADR 0072).

rules:
  - id: AZURE-READONLY-001
    trigger: worker.command
    question: Is this command one of the read-only Azure CLI forms this folder allows?
    answers: [listed-read, outside-list]
    decide:
      - when: { fact: command.form, matches: ["az * list", "az * list-*", "az * show", "az * show-*"] }
        answer: listed-read
      - when: { all: [{ fact: worker.capability-profile, equals: platform-reader }, { fact: command.program, equals: az }] }
        answer: outside-list
    effects: { listed-read: allow, outside-list: escalate }
