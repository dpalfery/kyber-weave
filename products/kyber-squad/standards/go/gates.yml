# Gate catalogue, family go (technology: go).
# Marker go.mod, nesting each: nested modules are excluded from a parent's ./... pattern.
# Every council gate runs with working-directory set to the module root, except where noted.
# golangci-lint is third-party: install and pin it yourself, then uncomment the gate (when: optional).
schema: 1
family: go
technologies: [go]
roots:
  markers: ["go.mod"]
  nesting: each
gates:
  - id: fmt
    role: format
    working-directory: "{{root}}"
    # `gofmt -d` exits 1 on a formatting diff only from Go 1.26 (`-l` exits 0 on every version, so it
    # cannot gate). On Go 1.25 and older `-d` exits 0 and this gate cannot fail. The toolchain
    # workflow proves both sides of that boundary.
    note: "requires Go 1.26 or newer: gofmt -d exits 1 on a diff only from 1.26; on Go 1.25 and older it exits 0, so this gate cannot fail"
    run: [gofmt, -d, .]
  - id: vet
    role: lint
    working-directory: "{{root}}"
    run: [go, vet, "./..."]
  - id: build
    role: build
    working-directory: "{{root}}"
    run: [go, build, "./..."]
  - id: test
    role: test
    working-directory: "{{root}}"
    run: [go, test, "./..."]
  - id: lint
    role: lint
    when: optional
    working-directory: "{{root}}"
    run: [golangci-lint, run, "./..."]
task-gates:
  - id: fmt
    role: format
    agents: [go-dev, test-dev]
    include: ["{{root-glob}}**/*.go"]
    note: "requires Go 1.26 or newer: gofmt -d exits 1 on a diff only from 1.26; on Go 1.25 and older it exits 0, so this gate cannot fail"
    run: [gofmt, -d, "{changed}"]
    fix: [gofmt, -w, "{changed}"]
  - id: vet
    role: lint
    agents: [go-dev, test-dev]
    include: ["{{root-glob}}**/*.go"]
    working-directory: "{{root}}"
    run: [go, vet, "./..."]
sources:
  fmt: https://raw.githubusercontent.com/golang/go/master/src/cmd/gofmt/gofmt.go
  vet: https://pkg.go.dev/cmd/vet
  build: https://pkg.go.dev/cmd/go
  test: https://pkg.go.dev/cmd/go
  lint: https://golangci-lint.run/docs/welcome/install/local/
