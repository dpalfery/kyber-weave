# The reviewer role folder's shipped Arbiter rules: the review-lens applicability,
# quote, pre-existing, claim, gate, nitpick, duplicate, comment, severity and override
# gates. Ids are permanent: suppressions, baselines and code-scanning alerts key on them,
# so a rule is never renumbered or reused.
#
# A rule keeps the id, question, answers and effects it had in default-rules.yml. The
# step-0 predicate set is closed (all, any, not, exists, equals, in, matches, subset-of,
# intersects, count); an operand naming a fact the trigger supplies is a reference, and any
# other string is a literal. An answer the Arbiter cannot reach allows and is logged
# (ADR 0072).

rules:
  - id: KW-ARB-LENS-001
    trigger: lens.spawn
    question: Does the lens apply to this change?
    answers: [applies, not-applicable, asked-by-review-seats]
    # A Markdown-only change has no code for these two lenses to judge, which is what
    # their Applicability text says. The set has to be positively Markdown-only to skip:
    # an empty or unreadable set satisfies subset-of vacuously, and on a committed tree
    # the set was empty, so both lenses vanished exactly when per-task commits made a
    # clean tree the normal case. The non-empty clause makes the skip need evidence.
    decide:
      - when: { all: [{ fact: lens.name, equals: correctness }, { not: { fact: review.changed-paths, count: 0 } }, { fact: review.changed-paths, subset-of: ["**/*.md"] }] }
        answer: not-applicable
      - when: { all: [{ fact: lens.name, equals: test-adequacy }, { not: { fact: review.changed-paths, count: 0 } }, { fact: review.changed-paths, subset-of: ["**/*.md"] }] }
        answer: not-applicable
      # `review seats` asks the question below before any seat is dispatched, on the changed-file summary and the
      # lens's own applicability text, and leaves a lens it confidently rules out unseated. A seat that is spawned has
      # passed that step, so the hook answers here and never asks the same question twice (ADR 0079, decision 10).
      - when: { fact: lens.name, exists: true }
        answer: asked-by-review-seats
    ask:
      type: noul
      state: { applicability: lens.applicability, diff: review.diff-summary }
      question: Does the lens apply to this change?
      instructions-from: "lens:"
      probability-below: 0.1
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { applies: allow, not-applicable: skip, asked-by-review-seats: allow }

  # A change with no code in it has nothing for these six lenses to judge. The skip needs
  # positive evidence: every changed path must be one the git read marked no-code, and the
  # set must be non-empty, so an absent or empty set stays undecidable and the lens runs.
  # Security, documentation-accuracy and blast-radius-revertibility are never listed here.
  - id: KW-ARB-LENS-002
    trigger: lens.spawn
    question: Is this lens one that has nothing to judge in a change with no code in it?
    answers: [no-code-change]
    decide:
      - when:
          all:
            - { fact: lens.name, in: [correctness, test-adequacy, performance, di-composition, duplicate-implementation, model-placement] }
            - { not: { fact: review.changed-paths, count: 0 } }
            - { fact: review.changed-paths, subset-of: review.no-code-change-paths }
        answer: no-code-change
    effects: { no-code-change: skip }

  - id: KW-ARB-QUOTE-001
    trigger: lens.returned
    question: Is each finding's excerpt present at its file:line?
    answers: [present, elsewhere, absent]
    decide:
      - when: { fact: finding.excerpt, equals: file.text-at-line }
        answer: present
    effects: { present: allow, elsewhere: annotate, absent: annotate }

  - id: KW-ARB-PREEX-001
    trigger: lens.returned
    question: Is the excerpt inside a changed hunk?
    answers: [in-hunk, outside-hunk]
    decide:
      - when: { all: [{ fact: finding.changed-lines, exists: true }, { fact: finding.line, in: finding.changed-lines }] }
        answer: in-hunk
      - when: { all: [{ fact: finding.changed-lines, exists: true }, { not: { fact: finding.line, in: finding.changed-lines } }] }
        answer: outside-hunk
    effects: { in-hunk: allow, outside-hunk: annotate }

  - id: KW-ARB-CLAIM-001
    trigger: refute.spawn
    question: Do the quoted code and its surroundings support the finding's claim?
    answers: [supports, contradicts, says_nothing, asked-by-review-verdict]
    # `review verdict` asks this before a refuter is sent, on the finding's own claim and quote and the cited lines read
    # from the tree; only a candidate it did not confirm reaches a refuter. The hook answers here and does not ask again.
    decide:
      - when: { fact: finding.id, exists: true }
        answer: asked-by-review-verdict
    ask:
      type: choice
      state: { claim: finding.claim, excerpt: finding.excerpt, surroundings: file.surroundings }
      criteria:
        supports: The quoted code and its surroundings support the finding's claim.
        contradicts: The quoted code contradicts the finding's claim.
        says_nothing: The quoted code says nothing about the finding's claim.
      confidence-at-least: 0.9
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { supports: verify, contradicts: allow, says_nothing: allow, asked-by-review-verdict: allow }

  - id: KW-ARB-GATE-CORROBORATED-001
    trigger: refute.spawn
    question: Does a failed gate already corroborate the finding?
    answers: [corroborated, not-corroborated]
    effects: { corroborated: verify, not-corroborated: allow }

  - id: KW-ARB-GATE-001
    trigger: gate.select
    question: Does any changed path match the gate's applies-when.paths?
    answers: [applies, not-applicable]
    decide:
      - when: { fact: review.changed-paths, intersects: gate.applies-when.paths }
        answer: applies
      - when: { fact: review.changed-paths, exists: true }
        answer: not-applicable
    effects: { applies: applies, not-applicable: not-applicable }

  # The nitpick filter reads one lens finding. `review verdict` asks it of each minor finding in the seat files, on the
  # finding's claim and failure scenario, and drops a confident nitpick from the counted set with the drop reported;
  # critical and major findings are never asked. The hook received a seat-file path rather than the finding text, so
  # it answers from step 0 and does not ask. Set `shadow: true` on this rule to have the verdict log the answer only.
  - id: KW-ARB-NITPICK-001
    trigger: lens.returned
    question: Is this lens finding a nitpick, or a substantive defect?
    answers: [substantive, nitpick, unsure, asked-by-review-verdict]
    decide:
      - when:
          any:
            - { fact: finding.severity, equals: Critical }
            - { fact: finding.gate-corroborated, equals: true }
        answer: substantive
      - when: { fact: finding.id, exists: true }
        answer: asked-by-review-verdict
    ask:
      type: choice
      state: { claim: finding.excerpt }
      criteria:
        substantive: The finding names a defect that changes behaviour, correctness or safety, or a real problem with tests, documentation accuracy or maintainability.
        nitpick: The finding is a purely stylistic point with no effect on how the application operates - formatting, wording preference or naming style. A naming issue that causes a defect or breaks a documented public contract is not one.
        unsure: The finding cannot be classed as either from the text given.
      confidence-at-least: 0.85
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { substantive: allow, nitpick: drop, unsure: allow, asked-by-review-verdict: allow }

  # A refutation of a finding the nitpick filter dropped is not worth a refuter. It follows
  # the filter's shadow state, so both rules are shipped in shadow together.
  - id: KW-ARB-NITPICK-002
    trigger: refute.spawn
    question: Did the nitpick filter drop this finding?
    answers: [dropped]
    shadow: true
    decide:
      - when: { fact: finding.dropped, equals: true }
        answer: dropped
    effects: { dropped: verify }

  # Two findings that name one defect are merged before the verdict. `review verdict` asks this for each pair of
  # seat-file findings on the same file within 20 lines, on each finding's claim and failure scenario, and keeps the
  # higher-severity, better-evidenced one with the merged ids reported. The hook answers from step 0 and does not ask.
  # Set `shadow: true` on this rule to have the verdict log the answer only.
  - id: KW-ARB-DUP-001
    trigger: refute.spawn
    question: Does an earlier finding of this review name the same defect as the refuted finding?
    answers: [same-defect, different-defect, asked-by-review-verdict]
    decide:
      - when: { fact: finding.id, exists: true }
        answer: asked-by-review-verdict
    ask:
      type: choice
      for-each: review.prior-findings
      state: { claim: finding.excerpt, prior: candidate.text }
      criteria:
        same-defect: "The earlier finding describes the same defect at the same place as the refuted finding."
        different-defect: "The earlier finding describes a different defect, or the same place for another reason."
      confidence-at-least: 0.9
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { same-defect: duplicate, different-defect: allow, asked-by-review-verdict: allow }

  # Bot review comment triage: classifies one bot comment against the code at the cited line as it is now.
  # A nitpick or an already-fixed comment is advised; any unsure answer keeps the comment real. Shipped in shadow until
  # calibration is read.
  - id: KW-ARB-COMMENT-001
    trigger: comment.triage
    question: "Is this bot review comment a real defect, a nitpick, or already fixed in the current code?"
    answers: [real, nitpick, already-fixed]
    shadow: true
    ask:
      type: choice
      state: { comment: comment.body, code: file.text-at-line }
      criteria:
        real: "The code at the cited line has the defect the comment describes."
        nitpick: "The comment is a style or preference point that does not change behaviour or correctness."
        already-fixed: "The code at the cited line no longer has the defect the comment describes."
      confidence-at-least: 0.85
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { real: keep, nitpick: advise, already-fixed: advise }

  # Severity sanity check: `review verdict` asks it of each accepted finding. Advisory only: a confident mismatch is noted
  # in the report for the lead reviewer, and the verdict keeps the severity the seat gave.
  - id: KW-ARB-SEVERITY-001
    trigger: review.verdict
    question: "Does the finding's stated severity match its stated impact?"
    answers: [too-high, about-right, too-low]
    ask:
      type: choice
      state: { severity: finding.severity, claim: finding.claim, failure-scenario: finding.failure-scenario }
      criteria:
        too-high: "The stated impact is lower than the severity says. critical means data loss, a security hole, corruption or a silent break in behaviour; major means the change is wrong or fails under conditions a reasonable user reaches; minor means real but bounded: a narrow edge case, a misleading comment or document statement, a missing test for a stated behaviour, a maintainability problem; a purely stylistic point is a nitpick, not a minor finding. A file placed against the repository's documented structure is major."
        about-right: "The stated impact matches the severity, as critical, major and minor are defined above."
        too-low: "The stated impact is higher than the severity says, as critical, major and minor are defined above."
      confidence-at-least: 0.8
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { too-high: advise, about-right: keep, too-low: advise }

  # Host severity overrides: `review verdict` asks it, for each finding that cites no override, once per row of the
  # review guidance's "Severity overrides" table that applies to the finding's lens and file. A confident "belongs"
  # grades the finding at the row's severity, reported as matched by the decision model; the most confident row wins.
  # Set `shadow: true` on this rule to have the verdict log the answer only.
  - id: KW-ARB-OVERRIDE-001
    trigger: review.verdict
    question: "Does the finding belong to the class of finding the host's severity override describes?"
    answers: [belongs, does-not-belong, unsure]
    ask:
      type: choice
      state: { finding: finding.claim, class: override.class }
      criteria:
        belongs: "The finding is an instance of the class of finding described: the same kind of problem, not merely the same file or topic."
        does-not-belong: "The finding is about another kind of problem, or touches the class only in passing."
        unsure: "The text given does not settle whether the finding belongs to the class."
      confidence-at-least: 0.85
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { belongs: advise, does-not-belong: keep, unsure: keep }

# The LENS-001 step-0 per-lens path table. It holds only path conditions the
# lens's own Applicability section states: documentation-only changes skip the
# two lenses that say so. Every other lens defers to step 1.
lens-paths:
  - lens: correctness
    not-applicable-when-all-match: ["**/*.md"]
  - lens: test-adequacy
    not-applicable-when-all-match: ["**/*.md"]
