schema: kyber-squad.capability-profiles/v1
capabilities:
  - filesystem.read
  # Opening a named file and sweeping the tree for matches are different grants: a role
  # can be entitled to read documents it is pointed at without being entitled to go
  # looking. Splitting them lets the orchestrator profile hold the first and refuse the
  # second, which a single filesystem.read could not express.
  - filesystem.search
  - filesystem.write
  - process.execute
  - network.read
  - network.publish
  - delegate
profiles:
  architect:
    permissions:
      filesystem.read: allow
      filesystem.search: allow
      filesystem.write: deny
      process.execute: deny
      network.read: allow
      network.publish: deny
      # Planning needs two kinds of fact the architect cannot obtain itself: live Azure
      # state, for which it holds no tools at all, and broad multi-location sweeps whose
      # raw output would crowd out the plan it is trying to write. Routing both through
      # the orchestrator cost a full round trip per question and made the conductor a
      # relay for work it has no opinion about. The grant is narrow — the roles reachable
      # from here are the two read-only discovery agents named in the architect bodies'
      # delegates-to, not the implementation roster — and it does not let the architect
      # hand work back: discovery agents return findings, never tasks.
      delegate: allow
  documentation:
    permissions:
      filesystem.read: allow
      filesystem.search: allow
      filesystem.write: allow
      process.execute: deny
      network.read: deny
      network.publish: deny
      delegate: deny
  investigator:
    permissions:
      filesystem.read: allow
      filesystem.search: allow
      filesystem.write: deny
      process.execute: allow
      network.read: allow
      network.publish: deny
      delegate: deny
  orchestrator:
    permissions:
      # Conductors open the plan, spec, and todo documents they route and sequence work
      # from. They do not go looking: both conductor bodies route discovery and searching
      # to architect, and filesystem.search: deny makes that boundary enforced rather than
      # merely asked for. The folder restriction itself is instruction-only — no target
      # expresses path scoping in its permission model.
      filesystem.read: allow
      filesystem.search: deny
      filesystem.write: deny
      process.execute: deny
      network.read: deny
      network.publish: deny
      delegate: allow
  product-planning:
    permissions:
      filesystem.read: allow
      filesystem.search: allow
      filesystem.write: ask
      process.execute: deny
      network.read: allow
      network.publish: deny
      delegate: allow
  publishing-worker:
    permissions:
      filesystem.read: allow
      filesystem.search: allow
      filesystem.write: allow
      process.execute: allow
      network.read: allow
      network.publish: ask
      delegate: deny
  read-only:
    permissions:
      filesystem.read: allow
      filesystem.search: allow
      filesystem.write: deny
      process.execute: deny
      network.read: allow
      network.publish: deny
      delegate: deny
  reviewer:
    permissions:
      filesystem.read: allow
      filesystem.search: allow
      # A reviewer writes exactly one thing: the findings artifact. The lattice has no path
      # scoping, so the scope is instruction-only and the permission is ask rather than
      # allow — the same split the orchestrator profile uses for its folder restriction.
      # Targets that cannot express ask narrow to deny, and the reviewer returns findings
      # in its response instead of writing a file. Separation of duties survives either
      # way: the role that judges a change never ships it.
      filesystem.write: ask
      # The gate layer runs real commands — build, tests, coverage, analyzers, scanners —
      # through one declared runner. Denying this made the blocking pre-merge gate in the
      # code-review skill unexecutable, which left the one agent whose purpose is refusing
      # unverified claims structurally forced to make one.
      process.execute: allow
      network.read: allow
      network.publish: deny
      # code-reviewer fans out a council of review-lens instances over the diff. Delegation
      # is a per-role grant, not a property of being a subagent: most profiles here deny
      # it outright, and the ones that hold it — reviewer for its council, architect for
      # read-only discovery — reach only the roles their own delegates-to names.
      delegate: allow
  worker:
    permissions:
      filesystem.read: allow
      filesystem.search: allow
      filesystem.write: allow
      process.execute: allow
      network.read: deny
      network.publish: deny
      delegate: deny
