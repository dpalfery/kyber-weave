# The prose rule catalog: the one list of rules the shipped agent and docs prose must state.
#
# Every rule is checked two ways (docs/standards/test/README.md, "Prose rules"):
#   - offline, by ProseRuleCatalogTests: every document named here exists, every section heading is
#     a heading in its document, every rule has a home and a negative control;
#   - by Jev, by ProseRuleGradingTests (KW_PROSE_GRADE=1): each `stated-in` document must be judged to
#     state the rule, each control must be judged not to, and each `absent-from` document must be
#     judged not to state the retired rule, while a copy with the retired `example` inserted must.
#
# Ids A1 to G7 are the worker rule map's (docs/kyber-squad/worker-rule-map.md); the rest are named
# for what they protect. A statement is one narrow, checkable judgment: split "and" into two rules.
# Paths are repository-relative; `*` and `**` globs are allowed. A `section` names the heading the
# rule lives under: it is sent instead of the whole file only when the file is over the model's budget.
version: 1
confidence-floor: 0.8
rules:
  # ---------------------------------------------------------------- report formats and the digest
  - id: A1
    statement: A developer worker ends its task with a completion digest of six fields in this order, STATUS, FILES, TESTS, COMMIT, REMOTE_HEAD and TASK_GATE.
    stated-in:
      - path: products/kyber-squad/skills/task-gate/SKILL.md
        section: Completion digest
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        section: Developer exit gate
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/skills/task-gate/references/rework.md
  - id: A2
    statement: The proof that a test-first task ran its tests failing first is the task gate's failing-run report written before its passing-run report, not a line the worker composes.
    stated-in:
      - path: products/kyber-squad/skills/task-gate/SKILL.md
        section: Failing run (test-first)
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        section: Test-first mode
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/skills/task-gate/references/rework.md
    retired:
      statement: The completion digest carries a RED_EVIDENCE line that names the runner filter, the failing tests and the reason, or says none when there was no RED run.
      example: "Add one more line after the six digest fields: RED_EVIDENCE: <runner filter> — <failing tests> — <reason>, or RED_EVIDENCE: none when no RED run was recorded."
      seed-into: products/kyber-squad/skills/task-gate/references/rework.md
      absent-from:
        - products/kyber-squad/skills/task-gate/SKILL.md
  - id: A3
    statement: When the circuit breaker trips, the worker returns STATUS ESCALATION with one CIRCUIT_BREAKER_TRIGGER token instead of the completion digest.
    stated-in:
      - path: products/kyber-squad/skills/task-gate/references/rework.md
        section: The escalation
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/agents/conductor/references/autonomy.md
  - id: A4
    statement: A developer whose change reads input from outside the process fills an input-site table for that input and fixes every cell where the code throws or does the wrong thing.
    stated-in:
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        section: Developer exit gate
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/skills/task-gate/references/rework.md
  - id: A4-whole-class
    statement: A fix for a reported defect covers the defect's whole class, naming the class and testing at least three other inputs of it.
    stated-in:
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        section: Developer exit gate
      - path: products/kyber-squad/agents/test-dev.md
        anchor: "Defect class:"
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/agents/conductor/references/autonomy.md
  - id: A4-input-site-tests
    statement: A test of code that parses outside input has one case per input-site column and asserts that the bad input is refused.
    stated-in:
      - path: docs/standards/test/README.md
        section: Test the decision, not the implementation
    controls:
      - docs/standards/github-actions/README.md
      - products/kyber-squad/shared/worker-baseline.md
  - id: parsers-fail-closed
    statement: A parser refuses input it does not recognise with a diagnostic that names it, and never silently drops, defaults or coerces that input.
    stated-in:
      - docs/standards/csharp/README.md
      - docs/standards/go/README.md
      - docs/standards/rust/README.md
      - docs/standards/typescript/README.md
    controls:
      - docs/standards/github-actions/README.md
      - products/kyber-squad/shared/worker-baseline.md
  - id: digest-extra-lines
    statement: Lines beside the digest such as Discovery or COVERAGE_GAPS are never counted or rejected as an extra digest field.
    stated-in:
      - products/kyber-squad/skills/task-gate/SKILL.md
      - products/kyber-squad/skills/delivery-execution/SKILL.md
      - path: docs/kyber-squad/requirements.md
        section: Conductor execution and worker invariants
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/skills/task-gate/references/rework.md
  - id: E4
    statement: Artifact and baseline paths go in the message body beside the completion digest, not inside the digest.
    stated-in:
      - products/kyber-squad/agents/csharp-dev.md
      - path: products/kyber-squad/agents/test-dev.md
        anchor: "Baseline:"
    controls:
      - products/kyber-squad/agents/go-dev.md
      - products/kyber-squad/shared/worker-baseline.md
  - id: coverage-gaps-in-message-body
    statement: Coverage gaps are reported in the message body beside the completion digest, not as a digest field.
    stated-in:
      - path: products/kyber-squad/agents/test-dev.md
        anchor: "COVERAGE_GAPS:"
    controls:
      - products/kyber-squad/agents/go-dev.md
      - products/kyber-squad/shared/worker-baseline.md
  - id: six-field-rejection
    statement: The conductor rejects a completion digest that is missing a required field or whose STATUS or TASK_GATE is FAIL.
    stated-in:
      - path: docs/kyber-squad/onboarding.md
        section: Standardized 6-field completion digest
      - path: docs/kyber-squad/requirements.md
        section: Conductor execution and worker invariants
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - docs/kyber-arbiter/jev-decision-model.md
  - id: six-field-phased-rollout
    statement: During the phased rollout only csharp-dev and test-dev must return the full six-field digest; other developer workers return their own completion plus a TASK_GATE line.
    stated-in:
      - products/kyber-squad/agents/conductor.md
      - products/kyber-squad/skills/delivery-execution/SKILL.md
    controls:
      - products/kyber-squad/skills/task-gate/references/rework.md
      - products/kyber-squad/agents/conductor/references/autonomy.md
  - id: commit-with-task-line
    statement: A finished task is committed with a "Task:" line naming the task, so a resumed run can find where work stopped.
    stated-in:
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        section: Task commits and resumption
    controls:
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        without-section: Task commits and resumption
      - products/kyber-squad/agents/conductor/references/autonomy.md
  # ---------------------------------------------------------------- the failure loop
  - id: B1
    statement: A worker stops after 3 test-fix iterations against one failing test or failure cluster and trips the circuit breaker.
    stated-in:
      - path: products/kyber-squad/skills/task-gate/references/rework.md
        section: The iteration cap
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/agents/conductor/references/autonomy.md
  - id: B2
    statement: If a fix needs files outside the authorised scope, the worker halts and raises BLAST_RADIUS_EXCEEDED.
    stated-in:
      - path: products/kyber-squad/skills/task-gate/references/rework.md
        section: The three JEV checkpoints
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/agents/conductor/references/autonomy.md
  - id: B3
    statement: An A-to-B-to-A oscillation or a repeating failure signature raises THRASH_OSCILLATION_DETECTED.
    stated-in:
      - path: products/kyber-squad/skills/task-gate/references/rework.md
        section: The three JEV checkpoints
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/agents/conductor/references/autonomy.md
  - id: B4
    statement: A worker never bends production code to satisfy a legacy test that contradicts the approved design; it raises INVARIANT_CONTRADICTION instead.
    stated-in:
      - path: products/kyber-squad/skills/task-gate/references/rework.md
        section: The three JEV checkpoints
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/agents/conductor/references/autonomy.md
  - id: B5
    statement: A worker never enters an unconstrained test-fix loop; when fixes do not converge it escalates instead of continuing to try.
    stated-in:
      - path: products/kyber-squad/skills/task-gate/references/rework.md
        section: Never enter an unconstrained test-fix loop
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/skills/code-review/references/lenses/performance.md
  - id: B6
    statement: The conductor allows at most 3 rework dispatches per failure cluster before its circuit breaker trips.
    stated-in:
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        section: Iteration circuit-breaker and loop detection
    controls:
      - products/kyber-squad/skills/task-gate/references/rework.md
      - products/kyber-squad/shared/worker-baseline.md
  - id: resume-counts-as-rework
    statement: Resuming a worker's session for rework counts as a rework dispatch in the per-cluster tally.
    stated-in:
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        section: Iteration circuit-breaker and loop detection
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/skills/code-review/references/lenses/performance.md
  - id: loop-detection
    statement: The conductor detects loops in rework, so the same failure cannot be dispatched over and over.
    stated-in:
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        section: Iteration circuit-breaker and loop detection
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/skills/code-review/references/lenses/performance.md
  - id: G7
    statement: An A/B oscillation in a failure cluster trips the conductor's circuit breaker immediately.
    stated-in:
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        anchor: "oscillation"
        section: Iteration circuit-breaker and loop detection
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/agents/conductor/references/autonomy.md
  - id: G5
    statement: A valid STATUS ESCALATION from a worker is exempt from the six-field digest rejection.
    stated-in:
      - products/kyber-squad/agents/conductor.md
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        section: Iteration circuit-breaker and loop detection
      - path: docs/kyber-squad/requirements.md
        section: Conductor execution and worker invariants
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/agents/conductor/references/autonomy.md
  - id: G6
    statement: Rework for a task goes back to the original worker session that did the task, and a fresh worker is used only when that session cannot be continued.
    stated-in:
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        section: Task session continuity
    controls:
      - products/kyber-squad/agents/conductor/references/autonomy.md
      - products/kyber-squad/skills/task-gate/references/rework.md
  - id: task-gate-reject-to-worker
    statement: A failing TASK_GATE line sends the task back to its worker as rework.
    stated-in:
      - products/kyber-squad/agents/conductor.md
      - products/kyber-squad/skills/delivery-execution/SKILL.md
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/agents/conductor/references/autonomy.md
    retired:
      statement: Each finished task gets a three-pass audit by a task reviewer.
      example: After each task, run the three-pass task audit with the task reviewer before accepting it.
      seed-into: products/kyber-squad/agents/conductor/references/autonomy.md
      absent-from:
        - products/kyber-squad/agents/conductor.md
        - products/kyber-squad/skills/delivery-execution/SKILL.md
  - id: task-gate-none-applicable
    statement: TASK_GATE NONE_APPLICABLE means gates are declared for the agent but every declared gate was skipped because none applies.
    stated-in:
      - products/kyber-squad/skills/task-gate/SKILL.md
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/skills/code-review/references/lenses/performance.md
  - id: task-gate-two-cycle-cap
    statement: The task gate allows at most two fix-and-rerun cycles and then stops even if a gate still fails.
    stated-in:
      - products/kyber-squad/skills/task-gate/SKILL.md
    controls:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/agents/conductor/references/autonomy.md
  # ---------------------------------------------------------------- the full-suite ban and test runs
  - id: C1
    statement: A developer agent, or worker, never runs the full test suite.
    stated-in:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/skills/go-dev/references/gates-and-platforms.md
      - products/kyber-squad/skills/rust-dev/references/gates-and-platforms.md
      - products/kyber-squad/skills/typescript-dev/references/esm-and-gates.md
      - products/kyber-squad/standards/go/README.md
      - products/kyber-squad/standards/rust/README.md
      - products/kyber-squad/standards/typescript/README.md
      - path: AGENTS.md
        section: The inner loop
    controls:
      - path: products/kyber-squad/skills/bug-crusher/SKILL.md
        without-section: 3. TRIVIAL path — fix, verify, review
      - products/kyber-squad/agents/conductor/references/autonomy.md
    retired:
      statement: The reader may run the full test suite in some situations, for example once at the end to prove nothing else broke.
      example: Run the full test suite locally once, at the end, to prove your change broke nothing else.
      seed-into: products/kyber-squad/skills/code-review/references/lenses/performance.md
      absent-from:
        - docs/standards/test/README.md
        - products/kyber-squad/skills/kilo-review-loop/SKILL.md
        - products/kyber-squad/skills/go-dev/references/gates-and-platforms.md
        - products/kyber-squad/skills/rust-dev/references/gates-and-platforms.md
        - products/kyber-squad/skills/typescript-dev/references/esm-and-gates.md
  - id: C1-primary-sessions
    statement: The reader must never run the full test suite.
    stated-in:
      - path: products/kyber-squad/skills/bug-crusher/SKILL.md
        section: 3. TRIVIAL path — fix, verify, review
      - products/kyber-squad/skills/kilo-review-loop/SKILL.md
    controls:
      - path: products/kyber-squad/skills/bug-crusher/SKILL.md
        without-section: 3. TRIVIAL path — fix, verify, review
      - products/kyber-squad/skills/code-review/references/lenses/performance.md
  - id: conductor-never-dispatches-full-run
    statement: The conductor never dispatches a full test-suite run, not even for a cross-cutting change.
    stated-in:
      - products/kyber-squad/agents/conductor.md
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        section: Test-first mode
    controls:
      - products/kyber-squad/agents/conductor/references/autonomy.md
      - products/kyber-squad/skills/task-gate/references/rework.md
    retired:
      statement: The conductor may dispatch one full test-suite run, for example when shared test infrastructure changes.
      example: When a change reaches shared test infrastructure, the conductor alone dispatches one full run of the test suite.
      seed-into: products/kyber-squad/shared/worker-baseline.md
      absent-from:
        - products/kyber-squad/agents/conductor.md
  - id: task-end-touched-classes-only
    statement: At the end of a task, a worker runs only the test classes its task touched.
    stated-in:
      - products/kyber-squad/agents/conductor.md
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        section: Test-first mode
      - products/kyber-squad/agents/csharp-dev.md
      - products/kyber-squad/agents/test-dev.md
      - docs/standards/test/README.md
      - path: docs/kyber-squad/onboarding.md
        section: Fast assembly runner invocation
      - path: docs/kyber-squad/requirements.md
        section: Conductor execution and worker invariants
    controls:
      - products/kyber-squad/agents/conductor/references/autonomy.md
      - products/kyber-squad/skills/task-gate/references/rework.md
    retired:
      statement: The full test suite runs at the end of each task, in the task exit gate.
      example: Reserve full test suite execution for task end, where the exit gate runs it once per task.
      seed-into: products/kyber-squad/shared/worker-baseline.md
      absent-from:
        - products/kyber-squad/agents/conductor.md
        - products/kyber-squad/skills/delivery-execution/SKILL.md
        - docs/standards/test/README.md
        - path: docs/kyber-squad/onboarding.md
          section: Fast assembly runner invocation
        - path: docs/kyber-squad/requirements.md
          section: Conductor execution and worker invariants
  - id: full-suite-in-first-council-review
    statement: The full test suite runs in the review council's first full review, on the integrated head, and in CI.
    stated-in:
      - products/kyber-squad/agents/conductor.md
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        section: Test-first mode
      - docs/standards/test/README.md
    controls:
      - products/kyber-squad/agents/conductor/references/autonomy.md
      - products/kyber-squad/skills/task-gate/references/rework.md
  - id: review-fix-reruns-touched-gates
    statement: A review-fix round re-runs only the gates whose inputs the fix touched, never every gate; CI is the full re-check.
    stated-in:
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        section: "Review loop (the verdict's `fix:` lines)"
    controls:
      - products/kyber-squad/agents/conductor/references/autonomy.md
      - docs/kyber-arbiter/jev-decision-model.md
  - id: shared-infra-targeted-set
    statement: A worker whose change reaches shared test infrastructure still runs a targeted set of tests, not the full suite.
    stated-in:
      - products/kyber-squad/agents/csharp-dev.md
      - products/kyber-squad/agents/test-dev.md
      - docs/standards/test/README.md
    controls:
      - products/kyber-squad/agents/go-dev.md
      - products/kyber-squad/agents/conductor/references/autonomy.md
    retired:
      statement: A worker whose change reaches shared test infrastructure asks the conductor for one full test-suite run.
      example: If your change touches shared test infrastructure, ask the conductor for one full run of the suite.
      seed-into: products/kyber-squad/shared/worker-baseline.md
      absent-from:
        - products/kyber-squad/agents/csharp-dev.md
        - products/kyber-squad/agents/test-dev.md
        - docs/standards/test/README.md
  - id: shared-test-infra-definition
    statement: Shared test infrastructure is anything referenced by more than one test class.
    stated-in:
      - docs/standards/test/README.md
    controls:
      - docs/standards/csharp/README.md
      - products/kyber-squad/shared/worker-baseline.md
  - id: F1
    statement: A worker in a shared checkout isolates its build output per task with --artifacts-path.
    stated-in:
      - path: products/kyber-squad/agents/conductor.md
        anchor: "--artifacts-path"
      - products/kyber-squad/agents/csharp-dev.md
      - products/kyber-squad/agents/test-dev.md
      - path: products/kyber-squad/skills/delivery-execution/SKILL.md
        anchor: "--artifacts-path"
      - products/kyber-squad/skills/testing/SKILL.md
      - path: docs/kyber-squad/architecture.md
        anchor: "--artifacts-path"
        section: Concurrency and scheduling model (worktree and artifact isolation)
    controls:
      - products/kyber-squad/agents/go-dev.md
      - products/kyber-squad/agents/conductor/references/autonomy.md
  - id: F2
    statement: A worker in its own git worktree does not need --artifacts-path, because the worktree already isolates its build output.
    stated-in:
      - products/kyber-squad/agents/csharp-dev.md
      - products/kyber-squad/agents/test-dev.md
    controls:
      - products/kyber-squad/agents/go-dev.md
      - products/kyber-squad/shared/worker-baseline.md
  - id: F3
    statement: Build once and test many times, reusing the build with --no-build or running the compiled test assembly directly.
    stated-in:
      - products/kyber-squad/agents/conductor.md
      - products/kyber-squad/agents/csharp-dev.md
      - products/kyber-squad/agents/test-dev.md
      - products/kyber-squad/skills/delivery-execution/SKILL.md
      - products/kyber-squad/skills/testing/SKILL.md
      - docs/standards/test/README.md
    controls:
      - products/kyber-squad/agents/go-dev.md
      - products/kyber-squad/agents/conductor/references/autonomy.md
  - id: fully-qualified-test-class
    statement: A direct test-assembly run names each test class fully qualified, because a short name runs zero tests and still exits 0.
    stated-in:
      - docs/standards/test/README.md
      - products/kyber-squad/skills/delivery-execution/SKILL.md
    controls:
      - docs/standards/github-actions/README.md
      - products/kyber-squad/agents/conductor/references/autonomy.md
  - id: runner-in-test-standard
    statement: The exact command for running tests directly lives in the host test standard's Completion section.
    stated-in:
      - products/kyber-squad/agents/conductor.md
      - products/kyber-squad/agents/csharp-dev.md
      - products/kyber-squad/agents/test-dev.md
      - products/kyber-squad/skills/delivery-execution/SKILL.md
      - products/kyber-squad/skills/testing/SKILL.md
    controls:
      - products/kyber-squad/agents/go-dev.md
      - products/kyber-squad/agents/conductor/references/autonomy.md
  - id: runner-dotnet-only
    statement: The direct test-assembly runner applies to .NET; other languages use their own way of targeting tests.
    stated-in:
      - products/kyber-squad/skills/testing/SKILL.md
    controls:
      - products/kyber-squad/agents/go-dev.md
      - products/kyber-squad/shared/worker-baseline.md
  # ---------------------------------------------------------------- discovery, packets, and parallel work
  - id: D1
    statement: Before reading or searching files directly, the reader asks the code index (codegraph_explore) and the documentation tools.
    stated-in:
      - products/kyber-squad/shared/worker-baseline.md
      - products/kyber-squad/agents/architect.md
      - products/kyber-squad/agents/azure-reader.md
      - products/kyber-squad/agents/bug-crusher-investigator.md
      - products/kyber-squad/agents/code-reviewer.md
      - products/kyber-squad/agents/csharp-dev.md
      - products/kyber-squad/agents/dal-dev.md
      - products/kyber-squad/agents/docs-dev.md
      - products/kyber-squad/agents/github-devops.md
      - products/kyber-squad/agents/go-dev.md
      - products/kyber-squad/agents/maui-dev.md
      - products/kyber-squad/agents/pulumi-dev.md
      - products/kyber-squad/agents/python-dev.md
      - products/kyber-squad/agents/react-dev.md
      - products/kyber-squad/agents/review-lens.md
      - products/kyber-squad/agents/review-triage.md
      - products/kyber-squad/agents/rust-dev.md
      - products/kyber-squad/agents/sql-database-architect.md
      - products/kyber-squad/agents/tauri-dev.md
      - products/kyber-squad/agents/test-dev.md
      - products/kyber-squad/agents/typescript-dev.md
