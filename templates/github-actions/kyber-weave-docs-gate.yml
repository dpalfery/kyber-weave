# Sample: Kyber-Weave docs validate / drift
#
# Copy to .github/workflows/ and adapt the env paths below.
# The install script tracks the latest release; add `--version <x.y.z>` to the
# install step where a job must be reproducible.
# docs drift requires a CodeGraph index at .codegraph/codegraph.db
# (CodeGraph is host-owned; see README.md).

name: Kyber-Weave Docs Gate

"on":
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: kyber-weave-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Documentation root relative to the repository root (--docs-root).
  # Override to match the host (e.g. "6-Docs" or "docs").
  DOCS_ROOT: "docs"
  PROJECT_ROOT: "."

jobs:
  docs-validate:
    name: Docs validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Kyber-Weave
        run: |
          set -euo pipefail
          # Download then execute (not curl|sh) so SAST tools can verify the step.
          # Binaries the script installs are still SHA-256 verified against the Release.
          curl -fsSL -o "${RUNNER_TEMP}/kyber-weave-install.sh" \
            https://raw.githubusercontent.com/dpalfery/kyber-weave/main/scripts/install.sh
          sh "${RUNNER_TEMP}/kyber-weave-install.sh" --no-mcp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate documentation frontmatter
        run: >
          kyber-weave docs validate "${{ env.PROJECT_ROOT }}"
          --docs-root "${{ env.DOCS_ROOT }}"
          --format table

  docs-drift:
    name: Docs drift
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Kyber-Weave
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/kyber-weave-install.sh" \
            https://raw.githubusercontent.com/dpalfery/kyber-weave/main/scripts/install.sh
          sh "${RUNNER_TEMP}/kyber-weave-install.sh" --no-mcp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Host-owned: ensure .codegraph/codegraph.db exists before drift.
      # Example (adapt to your CodeGraph install):
      #   - run: npx codegraph sync .
      # Or restore a cached .codegraph directory from a previous job.
      - name: Require CodeGraph index
        run: |
          set -euo pipefail
          if [ ! -f .codegraph/codegraph.db ]
          then
            echo "::error::Missing .codegraph/codegraph.db. Build or restore a CodeGraph index before docs drift."
            exit 1
          fi

      - name: Verify documentation entity drift
        run: >
          kyber-weave docs drift "${{ env.PROJECT_ROOT }}"
          --docs-root "${{ env.DOCS_ROOT }}"
          --format table
