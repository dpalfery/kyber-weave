# Sample: Kyber-Weave skill validate / lint / scan
#
# Copy to .github/workflows/ and adapt the env paths below.
# The install script tracks the latest release; add `--version <x.y.z>` to the
# install step where a job must be reproducible. See README.md in this directory.

name: Kyber-Weave Skill Gate

"on":
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: kyber-weave-skill-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Space-separated skill roots. Missing directories are skipped.
  SKILL_DIRS: ".agents/skills"
  MIN_DESC_SCORE: "70"

jobs:
  skill-gate:
    name: Skill validate / lint / scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Kyber-Weave
        run: |
          set -euo pipefail
          # Download then execute (not curl|sh) so SAST tools can verify the step.
          # Binaries the script installs are still SHA-256 verified against the Release.
          curl -fsSL -o "${RUNNER_TEMP}/kyber-weave-install.sh" \
            https://raw.githubusercontent.com/dpalfery/kyber-weave/main/scripts/install.sh
          sh "${RUNNER_TEMP}/kyber-weave-install.sh" --no-mcp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate / lint / scan skill directories
        run: |
          set -euo pipefail
          EXIT_CODE=0
          mkdir -p kyber-weave-sarif
          for skills_dir in ${SKILL_DIRS}
          do
            if [ ! -d "${skills_dir}" ]
            then
              echo "Skipping missing skill directory: ${skills_dir}"
              continue
            fi
            safe_name=$(echo "${skills_dir}" | tr '/.' '__')
            echo "::group::${skills_dir}"
            kyber-weave skill validate "${skills_dir}" --format table || EXIT_CODE=1
            kyber-weave skill lint "${skills_dir}" --min-desc-score "${MIN_DESC_SCORE}" --format table || EXIT_CODE=1
            sarif_file="kyber-weave-sarif/skills-${safe_name}.sarif"
            kyber-weave skill scan "${skills_dir}" --fail-on critical --format sarif \
              > "${sarif_file}" || EXIT_CODE=1
            # The CodeQL action refuses one upload carrying two runs in the same category,
            # so stamp each file with its own. GitHub reads the category from the part of
            # automationDetails.id before the last `/`: the action itself writes
            # `<category>/` when it fills the field from a `category:` input, and a value
            # with no slash is read as an empty category (every skill collapses into one).
            # Appending the slash keeps one category per directory even with several
            # SKILL_DIRS entries. A consumer adopting this template has no prior
            # configuration to preserve, so per-directory categories are safe; a later
            # second directory adds a category rather than renaming one.
            # A failed stamp removes its temp file: the step uploads the whole directory,
            # and a stray .tmp must not reach the CodeQL action.
            if jq --arg category "kyber-weave-skills-${safe_name}/" \
              '.runs[].automationDetails.id = $category' "${sarif_file}" > "${sarif_file}.tmp"
            then
              mv "${sarif_file}.tmp" "${sarif_file}"
            else
              rm -f "${sarif_file}.tmp"
              EXIT_CODE=1
            fi
            echo "::endgroup::"
          done
          exit "${EXIT_CODE}"

      - name: Upload skill scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        with:
          sarif_file: kyber-weave-sarif
          category: kyber-weave-skills
