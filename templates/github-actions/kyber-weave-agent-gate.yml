# Sample: Kyber-Weave agent validate / scan / sync-check
#
# Copy to .github/workflows/ and adapt the harness matrix below.
# The install script tracks the latest release; add `--version <x.y.z>` to the
# install step where a job must be reproducible. See README.md in this directory.

name: Kyber-Weave Agent Gate

"on":
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: kyber-weave-agent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Repository root passed to agent commands (harnesses discovered under .*/agents).
  PROJECT_ROOT: "."

jobs:
  agent-gate:
    name: Agent validate / scan (${{ matrix.harness }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Adapt to the harnesses your host keeps in sync.
        harness: [codex, cursor, claude, github, opencode, kilo]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Kyber-Weave
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/dpalfery/kyber-weave/main/scripts/install.sh \
            | sh -s -- --no-mcp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate agents (${{ matrix.harness }})
        run: >
          kyber-weave agent validate "${{ env.PROJECT_ROOT }}"
          --harness ${{ matrix.harness }}
          --format table

      - name: Scan agents SARIF (${{ matrix.harness }})
        run: >
          kyber-weave agent scan "${{ env.PROJECT_ROOT }}"
          --harness ${{ matrix.harness }}
          --fail-on critical
          --format sarif
          > "kyber-weave-agent-${{ matrix.harness }}.sarif"

      - name: Upload agents SARIF (${{ matrix.harness }})
        if: always()
        uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        with:
          sarif_file: kyber-weave-agent-${{ matrix.harness }}.sarif
          category: kyber-weave-agent-${{ matrix.harness }}

  agent-sync:
    name: Agent sync-check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Kyber-Weave
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/dpalfery/kyber-weave/main/scripts/install.sh \
            | sh -s -- --no-mcp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cross-harness sync-check
        run: >
          kyber-weave agent sync-check "${{ env.PROJECT_ROOT }}"
          --format table
