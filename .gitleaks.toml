# gitleaks config for kyber-weave (root).
# Extends the default ruleset and allowlists KyberDash test fixtures and public
# identifiers that are not secrets. No path is allowlisted wholesale: dash/ was
# once excluded as vendored code, and is scanned like everything else since the
# one-time fork (ADR 0020).
[extend]
useDefault = true

# KyberDash false positives, each confirmed not to be a secret.
[[allowlists]]
description = "Test fixtures: obviously-fake API keys used as parser/validator input."
condition = "AND"
regexes = [
  '''sk-live-0123456789abcdef''',
  '''sk-live-AKIA1234567890SECRETKEY''',
]
paths = ['''(^|/)tests?/''']

[[allowlists]]
description = "Public OAuth client IDs (PKCE public-client flow, public by design)."
regexes = [
  '''9d1c250a-e61b-44d9-88ed-5944d1962f5e''',
  '''app_EMoamEEZ73f0CkXaXp7hrann''',
]

[[allowlists]]
description = "Non-secret identifiers the generic-api-key rule mis-fires on (synth dedup keys)."
condition = "AND"
regexes = ['''synth-[a-z0-9-]+''']
paths = ['''(^|/)tests?/''']

[[allowlists]]
description = "Canonical example JWT header used as a redaction/parse fixture."
condition = "AND"
regexes = ['''eyJhbGciOiJIUzI1NiIsIn''']
paths = ['''(^|/)tests?/''']

# KyberDash docs false positives (generic-api-key on pricing/cost semantics)
[[allowlists]]
description = "KyberDash docs: pricing/cost semantics, not secrets."
regexes = ['''priced/unpriced/estimated''']

# Specific false positives in KyberDash test and synthesizer code
[[allowlists]]
description = "KyberDash false positives (synth dedup keys, JWT fixture, pricing)."
regexes = [
  '''synth-retain-flag-91d''',
  '''synth-retain-89d''',
  '''synth-shard-age-91d''',
  '''priced/unpriced/estimated''',
  '''eyJhbGciOiJub25lIn0''',
]
