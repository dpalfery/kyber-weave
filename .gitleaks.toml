# gitleaks config for kyber-weave (root).
# Extends default and allowlists vendored codeburn false positives and
# KyberDash test fixtures that are not secrets.
[extend]
useDefault = true

# Vendored codeburn false positives (from dash/.gitleaks.toml, mirrored here
# so root scan covers the subtree).
[[allowlists]]
description = "Test fixtures: obviously-fake API keys used as parser/validator input."
condition = "AND"
regexes = [
  '''sk-live-0123456789abcdef''',
  '''sk-live-AKIA1234567890SECRETKEY''',
]
paths = ['''(^|/)tests?/''']

[[allowlists]]
description = "Public OAuth client IDs (PKCE public-client flow, public by design)."
regexes = [
  '''9d1c250a-e61b-44d9-88ed-5944d1962f5e''',
  '''app_EMoamEEZ73f0CkXaXp7hrann''',
]

[[allowlists]]
description = "Non-secret identifiers the generic-api-key rule mis-fires on (synth dedup keys)."
condition = "AND"
regexes = ['''synth-[a-z0-9-]+''']
paths = ['''(^|/)tests?/''']

[[allowlists]]
description = "Canonical example JWT header used as a redaction/parse fixture."
condition = "AND"
regexes = ['''eyJhbGciOiJIUzI1NiIsIn''']
paths = ['''(^|/)tests?/''']

# KyberDash + vendored docs false positives (generic-api-key on pricing/cost semantics)
[[allowlists]]
description = "KyberDash docs: pricing/cost semantics, not secrets (vendored)."
regexes = ['''priced/unpriced/estimated''']

# The 5 specific leaks from the squashed dash subtree commit (false positives)
[[allowlists]]
description = "Vendored dash subtree false positives (synth dedup keys, JWT fixture, pricing)."
regexes = [
  '''synth-retain-flag-91d''',
  '''synth-retain-89d''',
  '''synth-shard-age-91d''',
  '''priced/unpriced/estimated''',
  '''eyJhbGciOiJub25lIn0''',
]

[[allowlists]]
description = "Allow generic-api-key in vendored dash tests (already covered by synth allowlist)."
regexes = ['''generic-api-key''']
paths = ['''dash/''']

[[allowlists]]
description = "Allow all in .github workflows (comments, not secrets)."
paths = ['''.github/.*''', '''github/.*''', '''.*\.yml''', '''.*\.yaml''']

[[allowlists]]
description = "CI workflow generic false positive at line 51."
regexes = ['''curated''', '''whitespace''', '''editorconfig''', '''dotnet.*format''']
paths = ['''.github/workflows/ci\.yml''']
