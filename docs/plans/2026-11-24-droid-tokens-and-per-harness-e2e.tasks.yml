d join; T14's row pins Codex pairing.<br>- Counter twins: an OTLP row and a file row with equal counters within `TwinTurnMaxSkewMs` collapse to one turn (`DedupeTwinTurns` and `CollapseCluster`).<br>- `cursor`: overlapping file rows that `HasEvidencedCursorTwinShare` accepts collapse as documented (`CollapseOverlapFileJoins`).<br>- Mixed rows with no join key keep both turns.<br>`SqliteRelationalStore.DetectorVersion` is 6. | Tests fail to compile on the missing `CollectedRecord.SourceName`; then the pairing case fails because counter rows count as turns | All cases pass with a non-zero count; existing projection test classes the worker runs (`KyberDash.Application.Tests.Projection`) keep their assertions |


