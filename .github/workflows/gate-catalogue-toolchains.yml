# Gate catalogue real-toolchain run (R9.6) — Linux release gate.
#
# Each version-1 technology's catalogue gates run against their fixture
# projects with the real toolchain: once clean (must pass) and once per
# seeded defect (must fail its intended gate). The test class self-skips
# unless KW_GATE_TOOLCHAIN=1, so this workflow — not the default unit-test
# run — is what provides the R9.6 evidence.
#
# The npm install inside a temp copy is done by the test itself, so only
# the Node runtime is needed here (no repo-level npm ci).

name: gate-catalogue-toolchains

"on":
  pull_request:
    paths:
      - products/kyber-squad/standards/*/gates.yml
      - src/KyberWeave.Core/Review/**
      - src/KyberWeave.Core/Docs/Scaffolding/**
      - tests/fixtures/gate-catalogue/**
      - tests/KyberWeave.Tests/GateCatalogueToolchainTests.cs
      - .github/workflows/gate-catalogue-toolchains.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CONFIGURATION: Release

jobs:
  gate-catalogue-toolchains:
    name: gate-catalogue-toolchains
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Go is pinned, never `stable`, so a new Go release cannot change this job's result unreviewed.
      # The catalogue run below uses the current pin; the Go 1.25 run after it repeats the whole class
      # to prove the Go format gate fails on an older gofmt too (`gofmt -d` exits 0 there).
      - name: Setup Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      # Pin is the v1 tag. The toolchain is the input, not the action rev —
      # dtolnay/rust-toolchain treats @rev as a rustc version unless
      # toolchain is set explicitly. Same pin as the tray-rust job in ci.yml.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python gates
        run: python -m pip install --disable-pip-version-check ruff mypy pytest

      - name: Run gate catalogue toolchain tests
        env:
          KW_GATE_TOOLCHAIN: "1"
        run: >
          dotnet test tests/KyberWeave.Tests/KyberWeave.Tests.csproj
          -c ${{ env.CONFIGURATION }}
          --filter-class KyberWeave.Tests.GateCatalogueToolchainTests

      - name: Setup Go 1.25
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      # The Go format gate is `gofmt -l` with fail-on-output, so the defect fixture must fail it and the
      # clean fixture must pass it on Go 1.25 as well, where `gofmt -d` would exit 0 on a diff.
      - name: Run gate catalogue toolchain tests on Go 1.25
        env:
          KW_GATE_TOOLCHAIN: "1"
        run: |
          go version
          dotnet test tests/KyberWeave.Tests/KyberWeave.Tests.csproj \
            -c ${{ env.CONFIGURATION }} \
            --filter-class KyberWeave.Tests.GateCatalogueToolchainTests
