# Release — self-contained binaries and GitHub Release
#
# Cutting a release is a tag push by a repository admin:
#   git tag v0.1.2 && git push origin v0.1.2      (v0.2.0-rc.1 for a pre-release)
#
# A `refs/tags/v*` ruleset limits tag creation to admins, so GITHUB_TOKEN cannot
# mint a tag from a dispatched run — a tag push is the only path that publishes.
# Actions → Release → Run workflow builds and packages a candidate without
# creating a tag or Release.
#
# Builds the RID matrix, stamps Version from the tag, attaches archives +
# SHA256SUMS.txt to a GitHub Release (passing --prerelease for hyphenated pre-releases),
# and publishes PackAsTool packages (including pre-releases) to GitHub Packages.
#
# The `release` and `gh-packages` jobs run in the `release` environment, which
# requires a reviewer approval before any tag, GitHub Release, or package is
# published. Builds and packaging run unapproved so failures surface early.
#
# npm and Homebrew are not published from this workflow. nuget.org is forbidden.

name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.2, v0.1.2, or 0.2.0-rc.1). Dispatch builds only — publish by pushing the tag."
        type: string
        required: true
      dry_run:
        description: "Must stay true. Dispatch cannot publish; tag creation is admin-only."
        type: boolean
        default: true

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CONFIGURATION: Release

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      create_release: ${{ steps.meta.outputs.create_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Derive version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
          then
            RAW="${INPUT_VERSION:-}"
            if [[ -z "${RAW}" ]]
            then
              echo "::error::version input is required when running via workflow_dispatch"
              exit 1
            fi
            # Accept 0.1.2, v0.1.2, or 0.2.0-rc.1
            RAW="${RAW#v}"
            if [[ ! "${RAW}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
            then
              echo "::error::version '${INPUT_VERSION}' is not a valid SemVer (expected X.Y.Z or vX.Y.Z)"
              exit 1
            fi
            TAG="v${RAW}"
            VERSION="${RAW}"

            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1 \
              || gh release view "${TAG}" >/dev/null 2>&1
            then
              echo "::error::tag or Release ${TAG} already exists. Choose a new version."
              exit 1
            fi

            if [[ "${INPUT_DRY_RUN}" != "true" ]]
            then
              echo "::error::Publishing from workflow_dispatch is disabled — a refs/tags/v* ruleset limits tag creation to repository admins. Cut the release with: git tag ${TAG} && git push origin ${TAG}. Re-run with dry_run=true to build ${TAG} artifacts without publishing."
              exit 1
            fi
            CREATE_RELEASE=false
            echo "Dry run — will build ${TAG} artifacts without creating the tag or Release"
          else
            # Tag push: GITHUB_REF_NAME is the tag
            TAG="${GITHUB_REF_NAME}"
            RAW="${TAG#v}"
            if [[ ! "${RAW}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
            then
              echo "::error::tag '${TAG}' is not a valid SemVer (expected vX.Y.Z or vX.Y.Z-prerelease)"
              exit 1
            fi
            VERSION="${RAW}"
            CREATE_RELEASE=true
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "create_release=${CREATE_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "Release version=${VERSION} tag=${TAG} create_release=${CREATE_RELEASE}"

  build:
    name: Publish ${{ matrix.rid }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64
          - win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish CLI (self-contained single-file)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet publish src/KyberWeave.Cli/KyberWeave.Cli.csproj
          -c ${{ env.CONFIGURATION }}
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version="${VERSION}"
          -o ./publish/cli/${{ matrix.rid }}

      - name: Publish MCP (self-contained single-file)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet publish src/KyberWeave.Mcp/KyberWeave.Mcp.csproj
          -c ${{ env.CONFIGURATION }}
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version="${VERSION}"
          -o ./publish/mcp/${{ matrix.rid }}

      - name: Package archives
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${RID}" == win-* ]]
          then
            # -j junks directory paths so the archive contains only the .exe basename.
            # Paths are relative to the workspace root (same as the tar branch).
            zip -9 -j "dist/kyber-weave-${RID}.zip" "publish/cli/${RID}/kyber-weave.exe"
            zip -9 -j "dist/kyber-weave-mcp-${RID}.zip" "publish/mcp/${RID}/kyber-weave-mcp.exe"
          else
            tar -C "publish/cli/${RID}" -czf "dist/kyber-weave-${RID}.tar.gz" kyber-weave
            tar -C "publish/mcp/${RID}" -czf "dist/kyber-weave-mcp-${RID}.tar.gz" kyber-weave-mcp
          fi
          ls -la dist/

      - name: Upload RID archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-${{ matrix.rid }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  build-kyberdash:
    # Single-executable Node SEA packaging per KyberDash spec task 12.1 /
    # decision D7. RIDs follow the stable Node SEA set (not the .NET RID set),
    # so macOS is published as darwin-* rather than osx-* — install.sh re-maps.
    # macOS builds run on macos-latest so postject can be followed by an
    # ad-hoc codesign (which is what replaces postject's deliberate
    # invalidation of the embedded codesignature, per design.md D7 caveat b).
    name: Build KyberDash ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: darwin-arm64, os: macos-14,    exe: "",    archive: tar.gz }
          - { rid: darwin-x64,   os: macos-14,    exe: "",    archive: tar.gz }
          - { rid: linux-arm64,  os: ubuntu-latest, exe: "",  archive: tar.gz }
          - { rid: linux-x64,    os: ubuntu-latest, exe: "",  archive: tar.gz }
          - { rid: win-x64,      os: ubuntu-latest, exe: ".exe", archive: zip }
    env:
      NODE_VERSION: "22.13.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node (for tsup and postject only; SEA binary comes from nodejs.org/dist)
        uses: actions/setup-node@5e7f8364d2f2567dd9615d69ce0a8b9b178a1842 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bundle dash CLI as ESM + CJS
        # Task 1 spike: SEA needs a CommonJS entry alongside the upstream ESM
        # one. tsup emits both in one pass when --format lists both formats.
        working-directory: dash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          # --clean=false so the existing dist/ stays intact for fallout paths.
          # --splitting=false matches upstream while still emitting a single
          # CJS file tsup names cli.js when both formats target the same entry.
          npx tsup src/main.ts \
            --format esm,cjs \
            --target node20 \
            --out-dir dist-sea \
            --clean false \
            --dts false \
            --sourcemap false \
            --splitting false
          test -f dist-sea/cli.js || { echo "tsup did not emit cli.js" >&2; exit 1; }

      - name: Build Node SEA for ${{ matrix.rid }}
        working-directory: dash
        env:
          RID: ${{ matrix.rid }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          RID="${RID}"
          case "${RID}" in
              darwin-arm64) NODE_PLATFORM=darwin; NODE_ARCH=arm64 ;;
              darwin-x64)   NODE_PLATFORM=darwin; NODE_ARCH=x64   ;;
              linux-arm64)  NODE_PLATFORM=linux;  NODE_ARCH=arm64 ;;
              linux-x64)    NODE_PLATFORM=linux;  NODE_ARCH=x64   ;;
              win-x64)      NODE_PLATFORM=win;    NODE_ARCH=x64   ;;
              *) echo "::error::unsupported RID: ${RID}"; exit 1 ;;
          esac

          BUNDLE_DIR="$(pwd)/dist-sea"
          BIN_DIR="$(pwd)/dist-bin"
          WORK="$(mktemp -d)"
          mkdir -p "${BIN_DIR}"
          trap 'rm -rf "${WORK}"' EXIT

          # Download the platform's prebuilt Node archive from nodejs.org/dist.
          # Homebrew's node formula ships with SEA disabled (spec D7 caveat a),
          # so we never use it as the SEA host binary.
          TARBALL="node-${NODE_VERSION}-${NODE_PLATFORM}-${NODE_ARCH}"
          BASE_URL="https://nodejs.org/dist/${NODE_VERSION}"
          if [ "${NODE_PLATFORM}" = "win" ]; then
              URL="${BASE_URL}/${TARBALL}.zip"
              curl -fsSL -o "${WORK}/node.zip" "${URL}"
              unzip -q "${WORK}/node.zip" -d "${WORK}/node"
              NODE_BIN="${WORK}/node/node${EXE}"
          else
              URL="${BASE_URL}/${TARBALL}.tar.xz"
              curl -fsSL -o "${WORK}/node.tar.xz" "${URL}"
              tar -xJf "${WORK}/node.tar.xz" -C "${WORK}/node" --strip-components=1
              NODE_BIN="${WORK}/node/bin/node"
          fi
          [ -f "${NODE_BIN}" ] || { echo "::error::node binary missing"; exit 1; }

          # Configure SEA. The CJS bundle written by tsup is named cli.js when
          # both formats are emitted; that file is what the SEA loader resolves.
          SEA_CONFIG="${WORK}/sea-config.json"
          # shellcheck disable=SC2154
          cat > "${SEA_CONFIG}" <<EOF
          {
            "main": "${BUNDLE_DIR}/cli.js",
            "output": "${WORK}/sea-prep.blob",
            "useSnapshot": false,
            "disableExperimentalSEAWarning": true
          }
          EOF
          "${NODE_BIN}" --build-sea "${SEA_CONFIG}"

          FINAL_BIN="${BIN_DIR}/kyberdash${EXE}"
          cp "${NODE_BIN}" "${FINAL_BIN}"
          chmod +x "${FINAL_BIN}"

          # Inject the SEA blob into the executable. postject (npm) reframes
          # the binary without disturbing the executable header.
          npm install --no-save --no-audit --no-fund postject@0.0.1-20240712
          npx postject "${FINAL_BIN}" NODE_SEA_BLOB "${WORK}/sea-prep.blob" \
            --sentinel-fuse-bytes 0

          # macOS: ad-hoc codesign is required after postject replaces the
          # embedded signature (spec D7 caveat b). Linux and Windows runners
          # skip this step; install.sh strips com.apple.quarantine on first run.
          if [ "${NODE_PLATFORM}" = "darwin" ]; then
              codesign --sign - --force "${FINAL_BIN}"
              codesign --verify --verbose "${FINAL_BIN}" || true
              # Ensure no quarantine xattr was applied by AppleDouble-aware tools.
              xattr -c "${FINAL_BIN}" || true
          fi

          # Archive the artifact under the RID-keyed name the installer expects.
          if [ "${RID}" = "win-x64" ]; then
              zip -9 -j "${BIN_DIR}/kyberdash-${RID}.zip" "${FINAL_BIN}"
          else
              tar -C "${BIN_DIR}" -czf "${BIN_DIR}/kyberdash-${RID}.tar.gz" "kyberdash${EXE}"
          fi

          # Verify the SEA host can still report --version (catches a corrupt
          # blob or wrong-endianness inject failure before archiving).
          "${FINAL_BIN}" --version >/dev/null

          # Per-RID checksum file alongside the artifact, merged into the
          # SHA256SUMS.txt that ships with the Release (handled in the
          # release job by downloading all artifacts and re-checksumming).
          ( cd "${BIN_DIR}" && sha256sum "kyberdash-${RID}"*.* ) > "${BIN_DIR}/SHA256SUMS.txt"
          cat "${BIN_DIR}/SHA256SUMS.txt"

      - name: Upload KyberDash archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-kyberdash-${{ matrix.rid }}
          path: |
            dash/dist-bin/kyberdash-${{ matrix.rid }}.tar.gz
            dash/dist-bin/kyberdash-${{ matrix.rid }}.zip
            dash/dist-bin/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

  pack-squad:
    name: Package Kyber-Squad
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build CLI
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet build src/KyberWeave.Cli/KyberWeave.Cli.csproj
          -c ${{ env.CONFIGURATION }}
          -p:Version="${VERSION}"

      - name: Pack Squad (APM and Plugins)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet run --project src/KyberWeave.Cli --no-build -c ${{ env.CONFIGURATION }} --
          squad pack --format all --out ./dist-squad --version "${VERSION}"

      - name: Upload Squad archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: squad-archives
          path: |
            dist-squad/kyber-squad-*.zip
            dist-squad/kyber-squad-plugin-*.zip
          retention-days: 14
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, build, build-kyberdash, pack-squad]
    runs-on: ubuntu-latest
    if: needs.version.outputs.create_release == 'true'
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download all release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * | tee SHA256SUMS.txt
          ls -la

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          # Only reachable on a tag push, where the tag already exists. The --target
          # branch below is retained as a no-op guard: dispatched runs never set
          # create_release, so they never reach this job.
          TARGET_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          PRERELEASE_NOTICE=""
          if [[ "${VERSION}" == *"-"* ]]; then
            PRERELEASE_NOTICE=$'> [!NOTE]\n> **Pre-release build**: This is a pre-release version of Kyber-Weave ('"${VERSION}"').\n\n'
          fi

          NOTES="$(cat <<EOF
          ${PRERELEASE_NOTICE}## Kyber-Weave ${VERSION}

          Self-contained binaries (no .NET runtime required). Tag \`${TAG}\` stamps
          this Release and the binary Version metadata.

          | Tool / Bundle | Asset pattern |
          | --- | --- |
          | CLI | \`kyber-weave-<rid>.tar.gz\` / \`.zip\` |
          | MCP | \`kyber-weave-mcp-<rid>.tar.gz\` / \`.zip\` |
          | KyberDash | \`kyberdash-<rid>.tar.gz\` / \`.zip\` |
          | Squad APM | \`kyber-squad-<version>.zip\` |
          | Squad Plugins | \`kyber-squad-plugin-<version>.zip\` |

          Kyber-Weave RIDs (\`osx-*\`, .NET): \`linux-x64\`, \`linux-arm64\`, \`osx-x64\`, \`osx-arm64\`, \`win-x64\`.
          KyberDash RIDs (\`darwin-*\`, Node SEA): \`linux-x64\`, \`linux-arm64\`, \`darwin-x64\`, \`darwin-arm64\`, \`win-x64\`.

          Install:
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/dpalfery/kyber-weave/main/scripts/install.sh | sh -s -- --version ${VERSION}
          \`\`\`
          EOF
          )"

          ARGS=(release create "${TAG}" --title "Kyber-Weave ${VERSION}" --notes "${NOTES}" --generate-notes)
          if [[ "${VERSION}" == *"-"* ]]; then
            ARGS+=(--prerelease)
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]
          then
            ARGS+=(--target "${TARGET_SHA}")
          fi
          ARGS+=(release-assets/*)
          gh "${ARGS[@]}"

  gh-packages:
    name: Optional GitHub Packages (dotnet tool)
    needs: [version, build]
    runs-on: ubuntu-latest
    if: needs.version.outputs.create_release == 'true'
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack tools
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet pack KyberWeave.sln
          -c ${{ env.CONFIGURATION }}
          -p:Version=${VERSION}
          -o ./artifacts/nupkg

      - name: Push to GitHub Packages (secondary channel)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Secondary channel — packages (including pre-release .nupkg) published to GitHub Packages.
          # Target index: https://nuget.pkg.github.com/dpalfery (never nuget.org).
          dotnet nuget push "./artifacts/nupkg/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ github.token }}" \
            --skip-duplicate

