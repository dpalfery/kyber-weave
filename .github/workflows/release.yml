# Release — self-contained binaries and GitHub Release
#
# Triggers on v* tags. Builds the RID matrix, stamps Version from the tag,
# attaches archives + SHA256SUMS.txt to a GitHub Release, and optionally pushes
# PackAsTool packages to GitHub Packages.
#
# npm and Homebrew are not published from this workflow. nuget.org is forbidden.
#
# Versioning: push a new `v*` tag (e.g. v0.1.2) to cut a release. The tag is the
# source of truth for the Release name and binary Version metadata.

name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package only — skip creating the GitHub Release"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CONFIGURATION: Release

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Derive version from tag
        id: meta
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]
          then
            REF="v0.1.0-dev.${GITHUB_RUN_NUMBER}"
            echo "::warning::workflow_dispatch without tag — using ${REF} for artifact names only"
          fi
          TAG="${REF}"
          VERSION="${REF#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Release version=${VERSION} tag=${TAG}"

  build:
    name: Publish ${{ matrix.rid }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64
          - win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish CLI (self-contained single-file)
        run: >
          dotnet publish src/KyberWeave.Cli/KyberWeave.Cli.csproj
          -c ${{ env.CONFIGURATION }}
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ needs.version.outputs.version }}
          -o ./publish/cli/${{ matrix.rid }}

      - name: Publish MCP (self-contained single-file)
        run: >
          dotnet publish src/KyberWeave.Mcp/KyberWeave.Mcp.csproj
          -c ${{ env.CONFIGURATION }}
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ needs.version.outputs.version }}
          -o ./publish/mcp/${{ matrix.rid }}

      - name: Package archives
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${RID}" == win-* ]]
          then
            # -j junks directory paths so the archive contains only the .exe basename.
            # Paths are relative to the workspace root (same as the tar branch).
            zip -9 -j "dist/kyber-weave-${RID}.zip" "publish/cli/${RID}/kyber-weave.exe"
            zip -9 -j "dist/kyber-weave-mcp-${RID}.zip" "publish/mcp/${RID}/kyber-weave-mcp.exe"
          else
            tar -C "publish/cli/${RID}" -czf "dist/kyber-weave-${RID}.tar.gz" kyber-weave
            tar -C "publish/mcp/${RID}" -czf "dist/kyber-weave-mcp-${RID}.tar.gz" kyber-weave-mcp
          fi
          ls -la dist/

      - name: Upload RID archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-${{ matrix.rid }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    if: >
      github.ref_type == 'tag' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all RID archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: binaries-*
          path: release-assets
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * | tee SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$(cat <<EOF
          ## Kyber-Weave ${VERSION}

          Self-contained binaries (no .NET runtime required). Tag \`${TAG}\` stamps
          this Release and the binary Version metadata.

          | Tool | Asset pattern |
          | --- | --- |
          | CLI | \`kyber-weave-<rid>.tar.gz\` / \`.zip\` |
          | MCP | \`kyber-weave-mcp-<rid>.tar.gz\` / \`.zip\` |

          RIDs: \`linux-x64\`, \`linux-arm64\`, \`osx-x64\`, \`osx-arm64\`, \`win-x64\`.

          Install:
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/dpalfery/kyber-weave/main/scripts/install.sh | sh -s -- --version ${VERSION}
          \`\`\`
          EOF
          )"
          gh release create "${TAG}" \
            --title "Kyber-Weave ${VERSION}" \
            --notes "${NOTES}" \
            release-assets/*

  gh-packages:
    name: Optional GitHub Packages (dotnet tool)
    needs: [version, build]
    runs-on: ubuntu-latest
    if: >
      github.ref_type == 'tag' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack tools
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet pack KyberWeave.sln
          -c ${{ env.CONFIGURATION }}
          -p:Version=${VERSION}
          -o ./artifacts/nupkg

      - name: Push to GitHub Packages (secondary channel)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Secondary channel only — not the default install story. Never nuget.org.
          dotnet nuget push "./artifacts/nupkg/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ github.token }}" \
            --skip-duplicate
