# Release — self-contained binaries and GitHub Release
#
# Kick off from Actions → Release → Run workflow on main. Only dpalfery may
# start it. Builds run immediately. Publish waits on the `release` environment
# until David Palfery clicks Review deployments on that same run and approves.
# Leave "Make production release" unchecked to publish the next RC
# (0.1.7-rc.9 → 0.1.7-rc.10). Check it to publish the next stable
# (0.1.7-rc.9 → 0.1.7). scripts/next-release-version.sh picks the number.
# No PAT and no version field. GITHUB_TOKEN mints the tag after approval.
#
# The refs/tags/v* ruleset still blocks rewriting or deleting a tag except
# for admins. Creating a tag is allowed so this workflow can mint one.
# Tag push remains for minor/major/dev cuts:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Builds the RID matrix, stamps Version from the tag, attaches archives +
# SHA256SUMS.txt to a GitHub Release (passing --prerelease for hyphenated
# pre-releases), and publishes PackAsTool packages (including pre-releases)
# to GitHub Packages.
#
# npm and Homebrew are not published from this workflow. nuget.org is forbidden.

name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prod_release:
        description: "Make production release. Leave unchecked to publish the next RC."
        type: boolean
        default: false

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CONFIGURATION: Release

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    steps:
      - name: Restrict to dpalfery on an allowed ref
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          TRIGGERING_ACTOR="${TRIGGERING_ACTOR:-${ACTOR}}"
          if [[ "${ACTOR}" != "dpalfery" ]] || [[ "${TRIGGERING_ACTOR}" != "dpalfery" ]]
          then
            echo "::error::Only dpalfery may run the Release workflow (actor=${ACTOR}, triggering_actor=${TRIGGERING_ACTOR})."
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${REF}" != "refs/heads/main" ]]
          then
            echo "::error::Run the workflow from main. The release environment rejects any other branch."
            exit 1
          fi

  version:
    name: Resolve version
    needs: [authorize]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      create_release: ${{ steps.meta.outputs.create_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Derive version
        id: meta
        env:
          INPUT_PROD_RELEASE: ${{ inputs.prod_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
          then
            bash scripts/next-release-version.sh --self-test
            if [[ "${INPUT_PROD_RELEASE}" == "true" ]]
            then
              eval "$(bash scripts/next-release-version.sh --prod)"
            else
              eval "$(bash scripts/next-release-version.sh)"
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1 \
              || gh release view "${TAG}" >/dev/null 2>&1
            then
              echo "::error::tag or Release ${TAG} already exists. Re-run after the collision is gone."
              exit 1
            fi
            CREATE_RELEASE=true
            {
              echo "## Releasing \`${TAG}\`"
              if [[ "${INPUT_PROD_RELEASE}" == "true" ]]
              then
                echo "Production release (next stable)."
              else
                echo "Release candidate (RC number incremented)."
              fi
              echo
              echo "### David Palfery — approve here"
              echo "Builds run first. When they finish, this run waits."
              echo "On **this same workflow run page**, click **Review deployments**"
              echo "(top right, yellow banner). Tick \`release\` → **Approve and deploy**."
              echo "Nobody else can approve. That click publishes \`${TAG}\`."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            # Tag push: GITHUB_REF_NAME is the tag
            TAG="${GITHUB_REF_NAME}"
            RAW="${TAG#v}"
            if [[ ! "${RAW}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
            then
              echo "::error::tag '${TAG}' is not a valid SemVer (expected vX.Y.Z or vX.Y.Z-prerelease)"
              exit 1
            fi
            VERSION="${RAW}"
            CREATE_RELEASE=true
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "create_release=${CREATE_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "Release version=${VERSION} tag=${TAG} create_release=${CREATE_RELEASE}"

  build:
    name: Publish ${{ matrix.rid }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64
          - win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish CLI (self-contained single-file)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet publish src/KyberWeave.Cli/KyberWeave.Cli.csproj
          -c ${{ env.CONFIGURATION }}
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version="${VERSION}"
          -o ./publish/cli/${{ matrix.rid }}

      - name: Publish MCP (self-contained single-file)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet publish src/KyberWeave.Mcp/KyberWeave.Mcp.csproj
          -c ${{ env.CONFIGURATION }}
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version="${VERSION}"
          -o ./publish/mcp/${{ matrix.rid }}

      - name: Package archives
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${RID}" == win-* ]]
          then
            # -j junks directory paths so the archive contains only the .exe basename.
            # Paths are relative to the workspace root (same as the tar branch).
            zip -9 -j "dist/kyber-weave-${RID}.zip" "publish/cli/${RID}/kyber-weave.exe"
            zip -9 -j "dist/kyber-weave-mcp-${RID}.zip" "publish/mcp/${RID}/kyber-weave-mcp.exe"
          else
            tar -C "publish/cli/${RID}" -czf "dist/kyber-weave-${RID}.tar.gz" kyber-weave
            tar -C "publish/mcp/${RID}" -czf "dist/kyber-weave-mcp-${RID}.tar.gz" kyber-weave-mcp
          fi
          ls -la dist/

      - name: Upload RID archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-${{ matrix.rid }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  build-kyberdash:
    # Single-executable Node SEA packaging per KyberDash spec task 12.1 /
    # decision D7. RIDs follow the stable Node SEA set (not the .NET RID set),
    # so macOS is published as darwin-* rather than osx-* — install.sh re-maps.
    # macOS builds run on macos-latest so postject can be followed by an
    # ad-hoc codesign (which is what replaces postject's deliberate
    # invalidation of the embedded codesignature, per design.md D7 caveat b).
    name: Build KyberDash ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: darwin-arm64, os: macos-14,    exe: "",    archive: tar.gz }
          - { rid: darwin-x64,   os: macos-14,    exe: "",    archive: tar.gz }
          - { rid: linux-arm64,  os: ubuntu-latest, exe: "",  archive: tar.gz }
          - { rid: linux-x64,    os: ubuntu-latest, exe: "",  archive: tar.gz }
          - { rid: win-x64,      os: ubuntu-latest, exe: ".exe", archive: zip }
    env:
      NODE_VERSION: "24.21.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node (for tsup and postject only; SEA binary comes from nodejs.org/dist)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bundle dash CLI as ESM + CJS
        # ink and yoga-layout are ESM-only and use top-level await, so the SEA
        # bundle cannot be CommonJS. It is emitted as ESM and loaded by
        # src/sea-shim.cjs; tsup.sea.config.ts carries the reasoning.
        working-directory: dash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm version "${RELEASE_VERSION}" --no-git-tag-version --allow-same-version
          npx tsup --config tsup.sea.config.ts
          test -f dist-sea/main.js || { echo "tsup did not emit dist-sea/main.js" >&2; exit 1; }

      - name: Build Node SEA for ${{ matrix.rid }}
        working-directory: dash
        env:
          RID: ${{ matrix.rid }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          RID="${RID}"
          case "${RID}" in
              darwin-arm64) NODE_PLATFORM=darwin; NODE_ARCH=arm64 ;;
              darwin-x64)   NODE_PLATFORM=darwin; NODE_ARCH=x64   ;;
              linux-arm64)  NODE_PLATFORM=linux;  NODE_ARCH=arm64 ;;
              linux-x64)    NODE_PLATFORM=linux;  NODE_ARCH=x64   ;;
              win-x64)      NODE_PLATFORM=win;    NODE_ARCH=x64   ;;
              *) echo "::error::unsupported RID: ${RID}"; exit 1 ;;
          esac

          BUNDLE_DIR="$(pwd)/dist-sea"
          BIN_DIR="$(pwd)/dist-bin"
          WORK="$(mktemp -d)"
          mkdir -p "${BIN_DIR}" "${WORK}/node"
          trap 'rm -rf "${WORK}"' EXIT

          # Download the platform's prebuilt Node archive from nodejs.org/dist.
          # Homebrew's node formula ships with SEA disabled (spec D7 caveat a),
          # so we never use it as the SEA host binary.
          TARBALL="node-v${NODE_VERSION}-${NODE_PLATFORM}-${NODE_ARCH}"
          BASE_URL="https://nodejs.org/dist/v${NODE_VERSION}"
          if [ "${NODE_PLATFORM}" = "win" ]; then
              URL="${BASE_URL}/${TARBALL}.zip"
              curl -fsSL -o "${WORK}/node.zip" "${URL}"
              # unzip has no --strip-components, so the archive keeps its own
              # top-level directory; address the binary through it.
              unzip -q "${WORK}/node.zip" -d "${WORK}/node"
              NODE_BIN="${WORK}/node/${TARBALL}/node${EXE}"
          else
              URL="${BASE_URL}/${TARBALL}.tar.xz"
              curl -fsSL -o "${WORK}/node.tar.xz" "${URL}"
              tar -xJf "${WORK}/node.tar.xz" -C "${WORK}/node" --strip-components=1
              NODE_BIN="${WORK}/node/bin/node"
          fi
          [ -f "${NODE_BIN}" ] || { echo "::error::node binary missing"; exit 1; }

          # Configure SEA. The CJS bundle written by tsup is named cli.js when
          # both formats are emitted; that file is what the SEA loader resolves.
          SEA_CONFIG="${WORK}/sea-config.json"
          # The main script is the CommonJS shim, not the bundle: Node runs a
          # SEA main as CJS whatever its extension. The ESM bundle rides along
          # as an asset, and package.json answers the version lookups that
          # would otherwise resolve off a filesystem the binary does not have.
          # shellcheck disable=SC2154
          cat > "${SEA_CONFIG}" <<EOF
          {
            "main": "$(pwd)/src/sea-shim.cjs",
            "output": "${WORK}/sea-prep.blob",
            "useSnapshot": false,
            "disableExperimentalSEAWarning": true,
            "assets": {
              "main.js": "${BUNDLE_DIR}/main.js",
              "package.json": "$(pwd)/package.json"
            }
          }
          EOF
          # Built with the runner's own Node, not the downloaded one: for a
          # cross-built RID the target binary cannot execute here at all
          # (Exec format error). Both are ${NODE_VERSION}, and a non-snapshot
          # blob carries no host architecture, so the output is identical.
          node --experimental-sea-config "${SEA_CONFIG}"

          FINAL_BIN="${BIN_DIR}/kyberdash${EXE}"
          cp "${NODE_BIN}" "${FINAL_BIN}"
          chmod +x "${FINAL_BIN}"

          # Inject the SEA blob into the executable. postject (npm) reframes
          # the binary without disturbing the executable header.
          npm install --no-save --no-audit --no-fund postject@1.0.0-alpha.6
          # The fuse string must match the one Node compiles in, or the
          # runtime will not detect the injected blob. macOS additionally
          # needs the blob in the NODE_SEA segment.
          POSTJECT_ARGS=(--sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2)
          if [ "${NODE_PLATFORM}" = "darwin" ]; then
              POSTJECT_ARGS+=(--macho-segment-name NODE_SEA)
          fi
          npx postject "${FINAL_BIN}" NODE_SEA_BLOB "${WORK}/sea-prep.blob" \
            "${POSTJECT_ARGS[@]}"

          # macOS: ad-hoc codesign is required after postject replaces the
          # embedded signature (spec D7 caveat b). Linux and Windows runners
          # skip this step; install.sh strips com.apple.quarantine on first run.
          if [ "${NODE_PLATFORM}" = "darwin" ]; then
              codesign --sign - --force "${FINAL_BIN}"
              codesign --verify --verbose "${FINAL_BIN}" || true
              # Ensure no quarantine xattr was applied by AppleDouble-aware tools.
              xattr -c "${FINAL_BIN}" || true
          fi

          # Ship the third-party notices with the binary (R1.5): the archive is
          # what install.sh downloads and unpacks, so the attribution travels
          # wherever the binary goes.
          cp THIRD_PARTY_NOTICES.md "${BIN_DIR}/THIRD_PARTY_NOTICES.md"

          # Archive the artifact under the RID-keyed name the installer expects.
          if [ "${RID}" = "win-x64" ]; then
              zip -9 -j "${BIN_DIR}/kyberdash-${RID}.zip" "${FINAL_BIN}" "${BIN_DIR}/THIRD_PARTY_NOTICES.md"
          else
              tar -C "${BIN_DIR}" -czf "${BIN_DIR}/kyberdash-${RID}.tar.gz" "kyberdash${EXE}" THIRD_PARTY_NOTICES.md
          fi

          # Verify the binary still reports --version (catches a corrupt blob or
          # a failed inject before archiving). Only meaningful where the RID is
          # native to this runner; a cross-built one cannot be executed here.
          HOST_OS="$(uname -s)"; HOST_ARCH="$(uname -m)"
          case "${HOST_OS}" in Darwin) HOST_OS=darwin ;; Linux) HOST_OS=linux ;; esac
          case "${HOST_ARCH}" in arm64|aarch64) HOST_ARCH=arm64 ;; x86_64) HOST_ARCH=x64 ;; esac
          if [ "${NODE_PLATFORM}" = "${HOST_OS}" ] && [ "${NODE_ARCH}" = "${HOST_ARCH}" ]; then
              "${FINAL_BIN}" --version >/dev/null
              echo "smoke test passed for ${RID}"
          else
              echo "skipping smoke test: ${RID} is cross-built on ${HOST_OS}-${HOST_ARCH}"
          fi

          # Per-RID checksum file alongside the artifact, merged into the
          # SHA256SUMS.txt that ships with the Release (handled in the
          # release job by downloading all artifacts and re-checksumming).
          # sha256sum is GNU coreutils; the macOS runners ship shasum instead.
          if command -v sha256sum >/dev/null 2>&1; then
              ( cd "${BIN_DIR}" && sha256sum "kyberdash-${RID}"*.* ) > "${BIN_DIR}/SHA256SUMS.txt"
          else
              ( cd "${BIN_DIR}" && shasum -a 256 "kyberdash-${RID}"*.* ) > "${BIN_DIR}/SHA256SUMS.txt"
          fi
          cat "${BIN_DIR}/SHA256SUMS.txt"

      - name: Upload KyberDash archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-kyberdash-${{ matrix.rid }}
          path: |
            dash/dist-bin/kyberdash-${{ matrix.rid }}.tar.gz
            dash/dist-bin/kyberdash-${{ matrix.rid }}.zip
            dash/dist-bin/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

  pack-squad:
    name: Package Kyber-Squad
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build CLI
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet build src/KyberWeave.Cli/KyberWeave.Cli.csproj
          -c ${{ env.CONFIGURATION }}
          -p:Version="${VERSION}"

      - name: Pack Squad (APM and Plugins)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet run --project src/KyberWeave.Cli --no-build -c ${{ env.CONFIGURATION }} --
          squad pack --format all --out ./dist-squad --version "${VERSION}"

      - name: Upload Squad archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: squad-archives
          path: |
            dist-squad/kyber-squad-*.zip
            dist-squad/kyber-squad-plugin-*.zip
          retention-days: 14
          if-no-files-found: error

  build-tray:
    # The KyberDash tray (spec task 9.4 / design C13). Unlike every other build
    # job this one runs under `environment: release`, because signing and
    # notarizing needs the team's Apple credentials and those are scoped there.
    #
    # Tauri's macOS bundler logs a warning and skips notarization when the
    # credentials are absent, rather than failing. A job that trusted it to fail
    # closed would publish an unnotarized app, so the presence check below runs
    # first and the assertions after the build check the result independently.
    name: Build tray ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: darwin-arm64, os: macos-14,        target: aarch64-apple-darwin,   asset: kyberdash-tray-darwin-arm64.zip }
          - { rid: darwin-x64,   os: macos-14,        target: x86_64-apple-darwin,    asset: kyberdash-tray-darwin-x64.zip }
          - { rid: win-x64,      os: windows-latest,  target: x86_64-pc-windows-msvc, asset: kyberdash-tray-win-x64-setup.exe }
    env:
      NODE_VERSION: "24.21.0"
      TEAM_ID: J2UNNQ466J
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Every macOS secret is checked before anything is built, so a missing
      # one costs seconds rather than a full signed build that silently is not
      # notarized (Requirements 12.2, 12.3).
      #
      # The environment variable names are Tauri's — its bundler reads
      # APPLE_CERTIFICATE and friends and nothing else — but the secrets they
      # come from are named for what they hold. The certificate pair exists on
      # the `release` environment as APPLE_DEVELOPER_ID_P12_*; the four below
      # it do not exist yet, which is why this job cannot go green. See
      # docs/todo/macos-developer-id-signing.md, part A.
      - name: Require the signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'missing signing secret: %s\n' "${missing[@]}" >&2
            echo "See docs/todo/macos-developer-id-signing.md for what each holds." >&2
            exit 1
          fi
          echo "all signing secrets present"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: dash/tray/src-tauri

      - name: Install tray UI dependencies
        working-directory: dash/tray/ui
        run: npm ci --no-audit --no-fund

      # A temporary keychain, deleted in the cleanup step, so the certificate
      # never joins the runner's login keychain and cannot outlive the job.
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/kyberdash-signing.keychain-db"
          # Random: the keychain lives for one job, so a fixed password would be
          # a checked-in secret for no benefit.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"

          # Without this, codesign prompts for the keychain password and hangs.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

      - name: Write the App Store Connect key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build and sign the tray (macOS)
        if: runner.os == 'macOS'
        # cwd is dash/tray, not dash/tray/ui: the Tauri CLI looks for
        # tauri.conf.json in a SUBfolder of the working directory and never
        # walks up, so from ui/ the sibling src-tauri/ is invisible and the CLI
        # aborts before it builds anything. The CLI itself still comes from
        # ui/node_modules, where npm ci put it, and is invoked through node
        # rather than the .bin shim so the same line works under pwsh on the
        # Windows runner.
        working-directory: dash/tray
        env:
          # The certificate is already in the keychain, so only the identity is
          # passed; setting APPLE_CERTIFICATE here would have the bundler import
          # it a second time into a keychain this job does not control.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node ui/node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.target }} --bundles app

      - name: Build the tray (Windows)
        if: runner.os == 'Windows'
        # cwd is dash/tray and the CLI is invoked through node for the reason
        # given on the macOS step above.
        working-directory: dash/tray
        run: node ui/node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.target }} --bundles nsis

      # Requirement 12.3: the bundler's own success is not evidence of
      # notarization, so each property is asserted against the built app.
      - name: Verify the signature, the team and the notarization
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="dash/tray/src-tauri/target/${{ matrix.target }}/release/bundle/macos/KyberDash.app"
          [ -d "$APP" ] || { echo "no app bundle at $APP" >&2; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$APP"

          FOUND_TEAM="$(codesign --display --verbose=4 "$APP" 2>&1 \
            | sed -n 's/^TeamIdentifier=//p')"
          if [ "$FOUND_TEAM" != "${TEAM_ID}" ]; then
            echo "expected TeamIdentifier ${TEAM_ID}, got '${FOUND_TEAM}'" >&2
            exit 1
          fi

          # Gatekeeper's own verdict, which fails on an unnotarized bundle.
          spctl --assess --type execute --verbose=4 "$APP"
          # And the stapled ticket, so the app opens on a machine that is offline.
          xcrun stapler validate "$APP"

      - name: Pack the app (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="dash/tray/src-tauri/target/${{ matrix.target }}/release/bundle/macos/KyberDash.app"
          mkdir -p dist-tray
          # ditto, not zip: it preserves the resource forks and extended
          # attributes the signature and the stapled ticket live in.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist-tray/${{ matrix.asset }}"

      - name: Collect the installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-tray
          SETUP="$(find "dash/tray/src-tauri/target/${{ matrix.target }}/release/bundle/nsis" \
            -name '*-setup.exe' -print -quit)"
          [ -n "$SETUP" ] || { echo "no NSIS installer was produced" >&2; exit 1; }
          cp "$SETUP" "dist-tray/${{ matrix.asset }}"

      - name: Upload the tray asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tray-${{ matrix.rid }}
          path: dist-tray/${{ matrix.asset }}
          retention-days: 14
          if-no-files-found: error

      - name: Remove the signing keychain
        # Runs even when the build failed, so a failure never leaves the
        # certificate behind on the runner.
        if: always() && runner.os == 'macOS'
        run: |
          rm -f "${APPLE_API_KEY_PATH:-}" || true
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi

  release:
    name: Publish GitHub Release (David Palfery must approve)
    needs: [version, build, build-kyberdash, build-tray, pack-squad]
    runs-on: ubuntu-latest
    if: needs.version.outputs.create_release == 'true'
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download all release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * | tee SHA256SUMS.txt
          ls -la

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          PRERELEASE_NOTICE=""
          if [[ "${VERSION}" == *"-"* ]]; then
            PRERELEASE_NOTICE=$'> [!NOTE]\n> **Pre-release build**: This is a pre-release version of Kyber-Weave ('"${VERSION}"').\n\n'
          fi

          NOTES="$(cat <<EOF
          ${PRERELEASE_NOTICE}## Kyber-Weave ${VERSION}

          Self-contained binaries (no .NET runtime required). Tag \`${TAG}\` stamps
          this Release and the binary Version metadata.

          | Tool / Bundle | Asset pattern |
          | --- | --- |
          | CLI | \`kyber-weave-<rid>.tar.gz\` / \`.zip\` |
          | MCP | \`kyber-weave-mcp-<rid>.tar.gz\` / \`.zip\` |
          | KyberDash | \`kyberdash-<rid>.tar.gz\` / \`.zip\` |
          | KyberDash tray | \`kyberdash-tray-darwin-<arch>.zip\` / \`kyberdash-tray-win-x64-setup.exe\` |
          | Squad APM | \`kyber-squad-<version>.zip\` |
          | Squad Plugins | \`kyber-squad-plugin-<version>.zip\` |

          Kyber-Weave RIDs (\`osx-*\`, .NET): \`linux-x64\`, \`linux-arm64\`, \`osx-x64\`, \`osx-arm64\`, \`win-x64\`.
          KyberDash RIDs (\`darwin-*\`, Node SEA): \`linux-x64\`, \`linux-arm64\`, \`darwin-x64\`, \`darwin-arm64\`, \`win-x64\`.

          Install:
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/dpalfery/kyber-weave/main/scripts/install.sh | sh -s -- --version ${VERSION}
          \`\`\`

          The KyberDash tray installs with \`kyberdash menubar\`, or with
          \`install.sh --with-menubar\` on macOS.

          > [!NOTE]
          > **Windows SmartScreen**: the tray installer is not signed with an EV
          > certificate, so SmartScreen may warn on first run until the download
          > builds reputation. Choose **More info -> Run anyway**. The macOS app is
          > signed with Developer ID (team \`J2UNNQ466J\`) and notarized.
          EOF
          )"

          ARGS=(release create "${TAG}" --title "Kyber-Weave ${VERSION}" --notes "${NOTES}" --generate-notes)
          if [[ "${VERSION}" == *"-"* ]]; then
            ARGS+=(--prerelease)
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]
          then
            ARGS+=(--target "${TARGET_SHA}")
          fi
          ARGS+=(release-assets/*)
          gh "${ARGS[@]}"

  gh-packages:
    name: Publish GitHub Packages (David Palfery must approve)
    needs: [version, build]
    runs-on: ubuntu-latest
    if: needs.version.outputs.create_release == 'true'
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack tools
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet pack KyberWeave.sln
          -c ${{ env.CONFIGURATION }}
          -p:Version=${VERSION}
          -o ./artifacts/nupkg

      - name: Push to GitHub Packages (secondary channel)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Secondary channel — packages (including pre-release .nupkg) published to GitHub Packages.
          # Target index: https://nuget.pkg.github.com/dpalfery (never nuget.org).
          dotnet nuget push "./artifacts/nupkg/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ github.token }}" \
            --skip-duplicate

