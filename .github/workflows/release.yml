# Release — self-contained binaries and GitHub Release
#
# Two ways to cut a release:
# 1. Push a `v*` tag (e.g. git push origin v0.1.2 or git push origin v0.2.0-rc.1)
# 2. Actions → Release → Run workflow, enter a version (creates the tag + Release)
#
# Builds the RID matrix, stamps Version from the tag, attaches archives +
# SHA256SUMS.txt to a GitHub Release (passing --prerelease for hyphenated pre-releases),
# and publishes PackAsTool packages (including pre-releases) to GitHub Packages.
#
# npm and Homebrew are not published from this workflow. nuget.org is forbidden.

name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.2, v0.1.2, or 0.2.0-rc.1). Creates tag vX.Y.Z at this commit."
        type: string
        required: true
      dry_run:
        description: "Build and package only — do not create the tag or GitHub Release"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CONFIGURATION: Release

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      create_release: ${{ steps.meta.outputs.create_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Derive version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
          then
            RAW="${INPUT_VERSION:-}"
            if [[ -z "${RAW}" ]]
            then
              echo "::error::version input is required when running via workflow_dispatch"
              exit 1
            fi
            # Accept 0.1.2, v0.1.2, or 0.2.0-rc.1
            RAW="${RAW#v}"
            if [[ ! "${RAW}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
            then
              echo "::error::version '${INPUT_VERSION}' is not a valid SemVer (expected X.Y.Z or vX.Y.Z)"
              exit 1
            fi
            TAG="v${RAW}"
            VERSION="${RAW}"

            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1 \
              || gh release view "${TAG}" >/dev/null 2>&1
            then
              echo "::error::tag or Release ${TAG} already exists. Choose a new version."
              exit 1
            fi

            if [[ "${INPUT_DRY_RUN}" == "true" ]]
            then
              CREATE_RELEASE=false
              echo "Dry run — will build ${TAG} artifacts without creating the tag or Release"
            else
              CREATE_RELEASE=true
            fi
          else
            # Tag push: GITHUB_REF_NAME is the tag
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            CREATE_RELEASE=true
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "create_release=${CREATE_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "Release version=${VERSION} tag=${TAG} create_release=${CREATE_RELEASE}"

  build:
    name: Publish ${{ matrix.rid }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64
          - win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish CLI (self-contained single-file)
        run: >
          dotnet publish src/KyberWeave.Cli/KyberWeave.Cli.csproj
          -c ${{ env.CONFIGURATION }}
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ needs.version.outputs.version }}
          -o ./publish/cli/${{ matrix.rid }}

      - name: Publish MCP (self-contained single-file)
        run: >
          dotnet publish src/KyberWeave.Mcp/KyberWeave.Mcp.csproj
          -c ${{ env.CONFIGURATION }}
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ needs.version.outputs.version }}
          -o ./publish/mcp/${{ matrix.rid }}

      - name: Package archives
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${RID}" == win-* ]]
          then
            # -j junks directory paths so the archive contains only the .exe basename.
            # Paths are relative to the workspace root (same as the tar branch).
            zip -9 -j "dist/kyber-weave-${RID}.zip" "publish/cli/${RID}/kyber-weave.exe"
            zip -9 -j "dist/kyber-weave-mcp-${RID}.zip" "publish/mcp/${RID}/kyber-weave-mcp.exe"
          else
            tar -C "publish/cli/${RID}" -czf "dist/kyber-weave-${RID}.tar.gz" kyber-weave
            tar -C "publish/mcp/${RID}" -czf "dist/kyber-weave-mcp-${RID}.tar.gz" kyber-weave-mcp
          fi
          ls -la dist/

      - name: Upload RID archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-${{ matrix.rid }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  pack-squad:
    name: Package Kyber-Squad
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build CLI
        run: >
          dotnet build src/KyberWeave.Cli/KyberWeave.Cli.csproj
          -c ${{ env.CONFIGURATION }}
          -p:Version=${{ needs.version.outputs.version }}

      - name: Pack Squad (APM and Plugins)
        run: >
          dotnet run --project src/KyberWeave.Cli --no-build -c ${{ env.CONFIGURATION }} --
          squad pack --format all --out ./dist-squad --version ${{ needs.version.outputs.version }}

      - name: Upload Squad archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: squad-archives
          path: |
            dist-squad/kyber-squad-*.zip
            dist-squad/kyber-squad-plugin-*.zip
          retention-days: 14
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, build, pack-squad]
    runs-on: ubuntu-latest
    if: needs.version.outputs.create_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * | tee SHA256SUMS.txt
          ls -la

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          # Tag push: tag already exists. workflow_dispatch: create tag at this commit
          # via --target so we do not git-push a tag (which would re-trigger this workflow).
          TARGET_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          PRERELEASE_NOTICE=""
          if [[ "${VERSION}" == *"-"* ]]; then
            PRERELEASE_NOTICE=$'> [!NOTE]\n> **Pre-release build**: This is a pre-release version of Kyber-Weave ('"${VERSION}"').\n\n'
          fi

          NOTES="$(cat <<EOF
          ${PRERELEASE_NOTICE}## Kyber-Weave ${VERSION}

          Self-contained binaries (no .NET runtime required). Tag \`${TAG}\` stamps
          this Release and the binary Version metadata.

          | Tool / Bundle | Asset pattern |
          | --- | --- |
          | CLI | \`kyber-weave-<rid>.tar.gz\` / \`.zip\` |
          | MCP | \`kyber-weave-mcp-<rid>.tar.gz\` / \`.zip\` |
          | Squad APM | \`kyber-squad-<version>.zip\` |
          | Squad Plugins | \`kyber-squad-plugin-<version>.zip\` |

          RIDs: \`linux-x64\`, \`linux-arm64\`, \`osx-x64\`, \`osx-arm64\`, \`win-x64\`.

          Install:
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/dpalfery/kyber-weave/main/scripts/install.sh | sh -s -- --version ${VERSION}
          \`\`\`
          EOF
          )"

          ARGS=(release create "${TAG}" --title "Kyber-Weave ${VERSION}" --notes "${NOTES}" --generate-notes)
          if [[ "${VERSION}" == *"-"* ]]; then
            ARGS+=(--prerelease)
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]
          then
            ARGS+=(--target "${TARGET_SHA}")
          fi
          ARGS+=(release-assets/*)
          gh "${ARGS[@]}"

  gh-packages:
    name: Optional GitHub Packages (dotnet tool)
    needs: [version, build]
    runs-on: ubuntu-latest
    if: needs.version.outputs.create_release == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack tools
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          dotnet pack KyberWeave.sln
          -c ${{ env.CONFIGURATION }}
          -p:Version=${VERSION}
          -o ./artifacts/nupkg

      - name: Push to GitHub Packages (secondary channel)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Secondary channel — packages (including pre-release .nupkg) published to GitHub Packages.
          # Target index: https://nuget.pkg.github.com/dpalfery (never nuget.org).
          dotnet nuget push "./artifacts/nupkg/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ github.token }}" \
            --skip-duplicate

