# CI — build, test, pack-to-artifacts, RID publish smoke, and security gates.
# No registry publish here (GitHub Release / optional GitHub Packages belong to
# release.yml). nuget.org is forbidden.
#
# Security jobs mirror motorcycle-rag-system's pr-gate (CodeQL, Trivy fs, Semgrep,
# gitleaks) without Azure/container/Dockerfile scans — this repo ships binaries, not
# cloud infrastructure.

name: CI

"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly CodeQL / dependency scan fallback when the tree is quiet
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CONFIGURATION: Release

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore KyberWeave.sln

      # Curated packs only — whitespace + a small style set from .editorconfig. # gitleaks:allow
      # Skip `dotnet format analyzers`: CA quality rules already fail the build via
      # TreatWarningsAsErrors / AnalysisMode=all.
      - name: Format (whitespace)
        run: >
          dotnet format KyberWeave.sln whitespace
          --verify-no-changes
          --no-restore
          -v minimal

      - name: Format (style)
        run: >
          dotnet format KyberWeave.sln style
          --verify-no-changes
          --severity warn
          --no-restore
          -v minimal

      - name: List vulnerable NuGet packages
        run: |
          set -euo pipefail
          # Belt-and-suspenders for NuGetAudit during restore (NU1903/NU1904 are errors
          # under TreatWarningsAsErrors). Clean output says "has no vulnerable packages";
          # failures say "has the following vulnerable packages".
          output="$(dotnet list KyberWeave.sln package --vulnerable --include-transitive 2>&1)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -Eqi 'has the following vulnerable packages'; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

      - name: Build
        run: dotnet build KyberWeave.sln -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: >
          dotnet test tests/KyberWeave.Tests/KyberWeave.Tests.csproj
          -c ${{ env.CONFIGURATION }}
          --no-build
          --report-trx
          --report-trx-filename kyber-weave.trx
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: TestResults/
          retention-days: 14
          if-no-files-found: warn

      - name: Pack (CI artifacts only — not published)
        run: >
          dotnet pack KyberWeave.sln
          -c ${{ env.CONFIGURATION }}
          --no-build
          -o ./artifacts/nupkg

      - name: Upload pack artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nupkg-artifacts
          path: artifacts/nupkg/
          retention-days: 14

  sbom:
    # The release workflow attaches a CycloneDX SBOM to every GitHub Release. This
    # job proves the generator works and that its output is schema-valid, without
    # needing a real release: it runs the same script the release job runs, the
    # same validator, and the same ecosystem expectations.
    #
    # The .NET SDK is set up because the .NET cataloger needs a *.deps.json, which
    # only a publish produces. With the SDK the nuget ecosystem is checked
    # strictly; without it the check degrades to a warning, because the fallback
    # to the checked-in packages.lock.json files is knowingly partial.
    name: SBOM (CycloneDX 1.6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The generator caches the pinned Syft tarball under the documented cache root
      # and re-verifies its SHA-256 on every run, so a restored cache is checked
      # before it is used rather than trusted.
      - name: Cache the pinned Syft tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kyber-weave
          key: syft-1.55.0-${{ runner.os }}-${{ runner.arch }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate the SBOM
        env:
          SBOM_VERSION: "0.0.0-ci"
        run: |
          set -euo pipefail
          mkdir -p sbom-out
          bash scripts/generate-sbom.sh sbom-out "${SBOM_VERSION}"

      - name: Validate the SBOM against the CycloneDX schema
        env:
          SBOM_VERSION: "0.0.0-ci"
        run: |
          set -euo pipefail
          # The generator validates its own output, but the check is repeated here
          # so that a schema violation shows up as its own step in the workflow log
          # rather than only as a generator failure.
          python3 scripts/validate-sbom.py \
            "sbom-out/kyber-weave-sbom-${SBOM_VERSION}.cdx.json" \
            --require-ecosystems npm,cargo,nuget

      - name: Summarise the SBOM
        env:
          SBOM_VERSION: "0.0.0-ci"
        run: |
          set -euo pipefail
          SBOM="sbom-out/kyber-weave-sbom-${SBOM_VERSION}.cdx.json"
          echo "Component counts by ecosystem:"
          jq -r '[.components[] | (.purl // "(no purl)") | split("/")[0]]
                 | group_by(.) | map({type: .[0], count: length})
                 | sort_by(-.count) | .[]
                 | "  \(.count)\t\(.type)"' "${SBOM}"
          {
            echo "### SBOM (CycloneDX 1.6)"
            echo
            jq -r '[.components[] | (.purl // "(no purl)") | split("/")[0]]
                   | group_by(.) | map({type: .[0], count: length})
                   | sort_by(-.count) | .[]
                   | "- \(.type): \(.count)"' "${SBOM}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-ci
          path: sbom-out/kyber-weave-sbom-*.cdx.json
          retention-days: 14
          if-no-files-found: error

  squad-filesystem-contract:
    name: Squad filesystem contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore KyberWeave.sln

      - name: Run Squad filesystem contract
        run: >
          dotnet test tests/KyberWeave.Tests/KyberWeave.Tests.csproj
          -c ${{ env.CONFIGURATION }}
          --no-restore
          --filter FullyQualifiedName~SquadDeploymentStateTests

  publish-smoke:
    name: Self-contained publish smoke (linux-x64)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish CLI (self-contained single-file)
        run: >
          dotnet publish src/KyberWeave.Cli/KyberWeave.Cli.csproj
          -c ${{ env.CONFIGURATION }}
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./artifacts/cli-linux-x64

      - name: Publish MCP (self-contained single-file)
        run: >
          dotnet publish src/KyberWeave.Mcp/KyberWeave.Mcp.csproj
          -c ${{ env.CONFIGURATION }}
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./artifacts/mcp-linux-x64

      - name: Smoke --help
        run: |
          set -euo pipefail
          ./artifacts/cli-linux-x64/kyber-weave --help
          ./artifacts/mcp-linux-x64/kyber-weave-mcp --help || true

      - name: Upload RID smoke artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rid-smoke-linux-x64
          path: |
            artifacts/cli-linux-x64/
            artifacts/mcp-linux-x64/
          retention-days: 7
          if-no-files-found: warn

  update-loop:
    name: Self-update and Squad install loop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-test
    # The loop runs npm-resolved code (npm ci, tsup, postject) to build kyberdash, so it
    # gets no more than it needs: without this it would inherit security-events: write.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # release-local.sh can build a "from" side out of a git worktree, which needs
          # more than the default single-commit fetch.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The loop builds the kyberdash single-executable the way release.yml does, which
      # needs npm for the bundle. The SEA itself is made from a Node that release-local.sh
      # downloads from nodejs.org at the version in dash/.nvmrc; this setup only has to
      # run npm and tsup, so it reads the same file.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dash/.nvmrc
          cache: npm
          cache-dependency-path: dash/package-lock.json

      # Publishes two single-file builds and a kyberdash, serves them from loopback, and
      # drives a real self-update followed by a real Squad install, then the KyberDash
      # cases. publish-smoke proves a published binary starts; this proves one can
      # replace itself and still work afterwards, which is the failure mode that shipped
      # in 0.1.6-rc.5 through rc.7. The KyberDash cases are what the install path
      # shipped without, when a release with no kyberdash archive installed nothing.
      - name: Run the update loop
        run: ./scripts/update-loop.sh

  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Intentional github/codeql-action v4 pin (v4.38.1)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # Scopes analysis to code this repo authors; see the config for why.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build solution
        if: matrix.language == 'csharp'
        run: |
          set -euo pipefail
          dotnet restore KyberWeave.sln
          dotnet build KyberWeave.sln --configuration Release --no-restore

      # Intentional github/codeql-action v4 pin (v4.38.1)
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"

  trivy:
    name: Trivy OSS Security Scan
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install verified Trivy CLI
        env:
          TRIVY_VERSION: "0.72.0"
          TRIVY_SHA256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/trivy/bin"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/trivy/bin" trivy
          echo "$RUNNER_TEMP/trivy/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/trivy/bin/trivy" --version

      # Scan once to JSON, then convert to both SARIF (for GitHub Security) and
      # table (for the job log). Scanning straight to SARIF leaves a failing job
      # with no findings printed anywhere in the log.
      - name: Scan repository with Trivy
        run: |
          set -euo pipefail
          trivy fs \
            --scanners vuln,misconfig,secret,license \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy.json \
            --skip-dirs .git \
            --skip-dirs TestResults \
            --skip-dirs artifacts \
            --skip-dirs '**/bin' \
            --skip-dirs '**/obj' \
            .

      - name: Convert Trivy report to SARIF
        if: always() && hashFiles('trivy.json') != ''
        run: trivy convert --format sarif --output trivy.sarif trivy.json

      - name: Report Trivy findings
        if: always() && hashFiles('trivy.json') != ''
        run: trivy convert --format table --exit-code 1 trivy.json

      # Intentional github/codeql-action v4 pin
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy

  semgrep:
    name: Semgrep Community SAST
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check "setuptools<82" semgrep==1.136.0

      # dash/ is first-party code since the one-time fork (ADR 0020), so it is
      # scanned like everything else.
      #
      # One rule is excluded rather than suppressed in source. p/default applies
      # its React ruleset to every TypeScript file, and react-insecure-request
      # fires on dash/src/otel/cursor-hook.ts, which is server-side Node posting
      # OTLP to the loopback receiver at 127.0.0.1:4318. That hop never leaves
      # the machine, so there is no transport for TLS to protect, and the local
      # OTLP receiver serves plain HTTP by design - there is no code fix, only a
      # rule that does not apply. Excluding it here keeps the decision visible in
      # review instead of buried in a source comment. It costs nothing today:
      # the rule finds nothing in dash/web, the actual React surface, which talks
      # to its own origin over relative URLs.
      - name: Scan repository with Semgrep
        run: |
          set -euo pipefail
          semgrep scan \
            --config p/default \
            --severity ERROR \
            --error \
            --metrics=off \
            --exclude 'TestResults/**' \
            --exclude 'artifacts/**' \
            --exclude '**/bin/**' \
            --exclude '**/obj/**' \
            --exclude-rule typescript.react.security.react-insecure-request.react-insecure-request \
            --sarif-output semgrep.sarif

      # Intentional github/codeql-action v4 pin
      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --no-git --verbose --redact --exit-code 2 --report-format sarif --report-path results.sarif --log-level debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload gitleaks SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
          category: gitleaks

  skill-docs-gate:
    name: Skill and docs gate
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the 004 closeout gate resolves its scope through
          # git merge-base, which a single-commit checkout cannot answer.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Dogfood the PR's CLI rather than installing a release — gate behaviour must match
      # the commit under test.
      - name: Build CLI
        run: >
          dotnet build src/KyberWeave.Cli/KyberWeave.Cli.csproj
          -c ${{ env.CONFIGURATION }}

      - name: Skill validate / lint / scan
        id: skill
        run: |
          set -euo pipefail
          EXIT_CODE=0
          mkdir -p kyber-weave-sarif
          # Every skill directory is gated under the same three verbs. Add a path here
          # AND a matching upload step below when a new skill lands, or the suite covers it
          # zero times / its SARIF never reaches code scanning.
          skills_dirs=(.apm/skills/kyber-docs-authoring .apm/skills/kyber-docs-integrity-review .apm/skills/kyber-docs-onboarding-and-assessment .apm/skills/kyber-weave-cli)
          CLI="dotnet run --project src/KyberWeave.Cli --no-build -c ${{ env.CONFIGURATION }} --"
          for skills_dir in "${skills_dirs[@]}"; do
            # Path-derived, not basename: two skills whose leaf directories share a name
            # would otherwise collide on one file name. Matches the skill-gate template.
            safe_name="$(echo "${skills_dir}" | tr '/.' '__')"
            $CLI skill validate "${skills_dir}" --format table || EXIT_CODE=1
            $CLI skill lint "${skills_dir}" --min-desc-score 70 --format table || EXIT_CODE=1
            # One run per file. Each upload step below owns one file and gives it one
            # `category`, so no two runs share a category — the CodeQL action rejects a
            # single upload that carries two runs in the same category.
            $CLI skill scan "${skills_dir}" --fail-on critical --format sarif \
              > "kyber-weave-sarif/skills-${safe_name}.sarif" || EXIT_CODE=1
          done
          exit "${EXIT_CODE}"

      # Code scanning identifies a configuration by (workflow, category) and diffs the set
      # between main and a PR head to decide which alerts the PR introduces. main produced
      # the docs analysis under exactly `kyber-weave-skills`, so this upload must keep that
      # name: renaming it reads as a removed configuration and raises "Code scanning cannot
      # determine the alerts introduced by this pull request". Do not "tidy" it to match the
      # file name or the cli category below.
      # Intentional github/codeql-action v4 pin
      - name: Upload skill scan SARIF (kyber-docs-authoring, legacy category)
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: kyber-weave-sarif/skills-_apm_skills_kyber-docs-authoring.sarif
          category: kyber-weave-skills

      # The integrity-review and onboarding-and-assessment skills are new names on
      # this branch, so they take path-derived categories like the cli skill.
      # A separate upload step, not one directory upload: the action applies a
      # single `category` to every run that has no automationDetails of its own,
      # and refuses two runs that share a category.
      # Intentional github/codeql-action v4 pin
      - name: Upload skill scan SARIF (kyber-docs-integrity-review)
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: kyber-weave-sarif/skills-_apm_skills_kyber-docs-integrity-review.sarif
          category: kyber-weave-skills-_apm_skills_kyber-docs-integrity-review

      # Intentional github/codeql-action v4 pin
      - name: Upload skill scan SARIF (kyber-docs-onboarding-and-assessment)
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: kyber-weave-sarif/skills-_apm_skills_kyber-docs-onboarding-and-assessment.sarif
          category: kyber-weave-skills-_apm_skills_kyber-docs-onboarding-and-assessment

      # The cli skill is new on this branch, so it has no prior configuration to preserve
      # and takes a path-derived category. A separate upload step, not one directory upload:
      # the action applies a single `category` to every run that has no automationDetails of
      # its own, and refuses two runs that share a category.
      # Intentional github/codeql-action v4 pin
      - name: Upload skill scan SARIF (kyber-weave-cli)
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: kyber-weave-sarif/skills-_apm_skills_kyber-weave-cli.sarif
          category: kyber-weave-skills-_apm_skills_kyber-weave-cli

      # --merge-ready adds KW-DOC-LIFECYCLE-003 (a plan or specification still open
      # fails the build) and KW-DOC-LIFECYCLE-004 (an archived entry the change
      # touches must carry its closeout evidence). Open work is correct on a branch
      # while it is built, never in a merge. --base scopes 004 to the change under
      # review: the PR target on pull_request, the pushed range on push, and the
      # remote default branch elsewhere (schedule, dispatch). Full history
      # (fetch-depth: 0 above) is what lets git merge-base resolve that scope.
      - name: Docs validate
        env:
          # Event values travel through env, never interpolated into run:,
          # so a hostile ref cannot reach the shell.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            BASE="origin/${BASE_REF}"
          elif [ -n "${EVENT_BEFORE}" ] && [ "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${EVENT_BEFORE}"
          else
            BASE="origin/HEAD"
          fi
          dotnet run --project src/KyberWeave.Cli --no-build -c ${{ env.CONFIGURATION }} -- \
            docs validate . --merge-ready --base "$BASE" --format table

      # docs drift needs a host-owned CodeGraph index (.codegraph/codegraph.db).
      # Kyber-Weave does not create that index; without a CI indexer/cache the gate would
      # fail closed on KW-DOC-DRIFT-001. Defer drift until an index is provisioned in CI.
      # Local/PR authors still run: docs drift . (see AGENTS.md).

  ts-gates:
    name: TypeScript gates (KyberDash)
    runs-on: ubuntu-latest
    needs: build-test
    # Mirrors the same three gates declared in .kyber-weave/kyber-weave.yml as
    # `ts-typecheck`, `ts-test`, `ts-lint`. The commands here are the exact
    # argv the gates emit; if a future change to the gate config or to the
    # dash/package.json scripts drifts away from the CI commands, this job
    # will not catch it. Aligning them explicitly in workflow-as-code is the
    # gate's source-of-truth counterpart to the argv-only entries there.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # engines.node in dash/package.json is >=22.13.0 and dash/.nvmrc pins
      # the same value. Loading from .nvmrc means the runner matches what a
      # local contributor with nvm has installed, with no second place to
      # update when the floor bumps. `cache: npm` reuses actions/setup-node's
      # ~350 MB built-in cache keyed on dash/package-lock.json so a cold
      # runner is the only cold one.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dash/.nvmrc
          cache: npm
          cache-dependency-path: |
            dash/package-lock.json
            dash/web/package-lock.json
            dash/tray/ui/package-lock.json

      # npm ci (not `npm install`): package-lock.json is committed so a CI
      # run reproduces the same devDependency graph a contributor's local
      # install produces. Without this knob, a future PR that bumps an
      # indirect dep silently forks the lint behaviour between dev and CI.
      - name: Install dash dependencies
        working-directory: dash
        run: npm ci --no-audit --no-fund

      # dash/web is a second package with its own lockfile, and
      # dash/vitest.config.ts includes its component tests via the
      # `web/src/**` pattern. Without this install those suites cannot resolve
      # react-dom/server, clsx, or @tanstack/react-query, which is exactly how
      # the ts-test gate was failing while passing on any machine that had run
      # an install there.
      - name: Install web dashboard dependencies
        working-directory: dash/web
        run: npm ci --no-audit --no-fund

      - name: Install tray UI dependencies
        working-directory: dash/tray/ui
        run: npm ci --no-audit --no-fund

      - name: TypeScript type check (ts-typecheck gate)
        working-directory: dash
        run: npm run typecheck

      # `test` excludes the cache-refresh-lock* files because vitest's
      # default pool forks them concurrently and writes to the same lock
      # file; upstream schedules those under `test:locks` instead.
      - name: TypeScript test (ts-test gate)
        working-directory: dash
        run: npm test

      - name: TypeScript lint (ts-lint gate)
        working-directory: dash
        run: npm run lint

      # Every non-test source file under dash/ must be reachable from an entry point, so a
      # deleted command cannot leave its private modules behind (spec task 2.1).
      - name: Unreachable module check
        working-directory: dash
        run: npm run check:reachable

      - name: Tray UI typecheck
        working-directory: dash/tray/ui
        run: npm run typecheck

      - name: Tray UI test
        working-directory: dash/tray/ui
        run: npm test

  # D6/D16 (harness OTel settings plan): the capture engine is required to work on Windows
  # (its route contract is POSIX-only), and no other job runs dash TypeScript off ubuntu. Only the capture
  # tests run here; the full suite stays on ts-gates. Equivalent local command:
  #   cd dash && npx vitest run src/capture
  # This job covers the engine only; the route contract (src/server/capture-route.test.ts) is
  # POSIX-only and runs in ts-gates.
  # If `npm ci` fails on Windows for an unrelated native dependency, the fallback is the
  # owner gate recorded in the plan (a real Windows round trip), not widening this job.
  capture-windows:
    name: Capture tests (windows-latest)
    runs-on: windows-latest
    needs: build-test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dash/.nvmrc
          cache: npm
          cache-dependency-path: dash/package-lock.json

      - name: Install dash dependencies
        working-directory: dash
        run: npm ci --no-audit --no-fund

      # The route test (src/server/capture-route.test.ts) injects platform 'darwin' and
      # compares host-joined paths, so it is POSIX-only; the engine tests are host-neutral.
      - name: Capture engine tests
        working-directory: dash
        run: npx vitest run src/capture

  tray-rust:
    name: Tray Rust gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    permissions:
      contents: read
    env:
      # Single source for the Tauri apt package list: the cache-key step
      # hashes this and the install step installs it, so the two cannot drift.
      TAURI_APT_PACKAGES: libwebkit2gtk-4.1-dev build-essential libgtk-3-dev libxdo-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # apt-get update on this job is seconds. The multi-minute stalls are
      # apt-get install pulling ~60 MB from azure.archive.ubuntu.com at tens of
      # kB/s. A restored deb archive lets apt install from disk, and apt still
      # checks each deb against the signed index, so a stale file is re-fetched
      # rather than installed. The primary key is the package list plus the ISO
      # week: caches are immutable, a package-list change misses, and each week
      # stores a new entry. restore-keys reuse the previous week when those
      # debs still match. actions/cache reads and writes as the runner user, so
      # the root-owned archive is handed over before restore and again after
      # install; a root-owned deb is unreadable to that save.
      - name: Resolve Tauri apt cache key
        if: runner.os == 'Linux'
        id: tauri-apt-key
        run: |
          set -euo pipefail
          printf '%s' "$TAURI_APT_PACKAGES" | sha256sum | awk '{print "packages=" $1}' >> "$GITHUB_OUTPUT"
          date -u +'week=%G-W%V' >> "$GITHUB_OUTPUT"

      - name: Prepare Tauri apt archive ownership
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo mkdir -p /var/cache/apt/archives/partial
          sudo chown -R "$(id -un):$(id -gn)" /var/cache/apt/archives

      - name: Cache Tauri Linux apt packages
        if: runner.os == 'Linux'
        id: tauri-apt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-tauri-apt-${{ steps.tauri-apt-key.outputs.packages }}-${{ steps.tauri-apt-key.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-tauri-apt-${{ steps.tauri-apt-key.outputs.packages }}-

      - name: Install Tauri Linux build dependencies
        if: runner.os == 'Linux'
        # Retry loop handles quick flakes only; a hung apt is killed by the step timeout.
        # Depends on env.retry, the attempt budget this loop reads (no new retry action).
        timeout-minutes: 45
        env:
          retry: "3"
        run: |
          set -euo pipefail
          attempt=1
          while [ "$attempt" -le "$retry" ]; do
            # Unquoted on purpose: the job env holds a space-separated list.
            if sudo apt-get update && sudo apt-get install -y $TAURI_APT_PACKAGES; then
              # Incomplete downloads live in partial/; the lock is root-owned.
              # Neither belongs in the cache, and the save runs as the runner.
              sudo rm -rf /var/cache/apt/archives/partial
              sudo rm -f /var/cache/apt/archives/lock
              sudo mkdir -p /var/cache/apt/archives/partial
              sudo chown -R "$(id -un):$(id -gn)" /var/cache/apt/archives
              exit 0
            fi
            if [ "$attempt" -eq "$retry" ]; then
              echo "Tauri apt install failed after $retry attempts; handing the archive back before exiting." >&2
              # Best-effort: the cache save runs as the runner user, so a
              # root-owned archive would add a save warning to the failure.
              sudo chown -R "$(id -un):$(id -gn)" /var/cache/apt/archives || true
              exit 1
            fi
            echo "Tauri apt attempt $attempt/$retry failed, retrying in 30s..." >&2
            sleep 30
            attempt=$((attempt + 1))
          done
          # Unreachable when the loop above runs (the last attempt exits
          # inside), but hand the archive back here too if ever reached.
          sudo chown -R "$(id -un):$(id -gn)" /var/cache/apt/archives || true
          exit 1

      - name: Setup Node for Linux tray build
        if: runner.os == 'Linux'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dash/.nvmrc
          cache: npm
          cache-dependency-path: dash/tray/ui/package-lock.json

      - name: Build tray UI for Linux
        if: runner.os == 'Linux'
        working-directory: dash/tray/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Pin is the v1 tag (an ancestor of master). The toolchain is the input,
      # not the action rev — dtolnay/rust-toolchain treats @rev as a rustc
      # version unless toolchain is set explicitly.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: dash/tray/src-tauri

      - name: Verify patched Linux GLib source
        if: runner.os == 'Linux'
        working-directory: dash/tray/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu |
            jq -e '
              ([.packages[] | select(.name == "glib" and .version == "0.18.5")]) as $glib |
              ($glib | length) == 1 and
              $glib[0].source == null and
              ($glib[0].manifest_path | endswith("/dash/tray/vendor/glib-0.18.5/Cargo.toml")) and
              ([.packages[] | select(.name == "glib" and .source != null and
                (.version | test("^0\\.(1[5-9])\\.")))] | length == 0)
            '
          cargo tree --locked -i glib --target x86_64-unknown-linux-gnu

      - name: Test patched GLib string iterator
        if: runner.os == 'Linux'
        run: cargo test --release --manifest-path dash/tray/vendor/glib-0.18.5/Cargo.toml test_variant_str_iter

      - name: cargo fmt --check
        working-directory: dash/tray/src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: dash/tray/src-tauri
        run: cargo clippy -- -D warnings

      - name: cargo test
        working-directory: dash/tray/src-tauri
        run: cargo test

      - name: cargo build --release --locked
        if: runner.os == 'Linux'
        working-directory: dash/tray/src-tauri
        run: cargo build --release --locked

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - build-test
      - sbom
      - publish-smoke
      - update-loop
      - codeql
      - skill-docs-gate
      - ts-gates
      - capture-windows
      - tray-rust
    if: always()
    steps:
      - name: Evaluate gate results
        run: |
          set -euo pipefail
          echo "## CI Results" > results.md
          echo "" >> results.md
          echo "| Job | Status |" >> results.md
          echo "|-----|--------|" >> results.md
          echo "| Build and test | ${{ needs.build-test.result }} |" >> results.md
          echo "| SBOM (CycloneDX 1.6) | ${{ needs.sbom.result }} |" >> results.md
          echo "| Publish smoke | ${{ needs.publish-smoke.result }} |" >> results.md
          echo "| Update loop | ${{ needs.update-loop.result }} |" >> results.md
          echo "| CodeQL Analysis | ${{ needs.codeql.result }} |" >> results.md
          echo "| Skill and docs gate | ${{ needs.skill-docs-gate.result }} |" >> results.md
          echo "| TypeScript gates (KyberDash) | ${{ needs.ts-gates.result }} |" >> results.md
          echo "| Capture tests (Windows) | ${{ needs.capture-windows.result }} |" >> results.md
          echo "| Tray Rust gates | ${{ needs.tray-rust.result }} |" >> results.md
          echo "" >> results.md
          echo "| Trivy OSS Security Scan | ${{ needs.trivy.result }} (advisory) |" >> results.md
          echo "| Semgrep Community SAST | ${{ needs.semgrep.result }} (advisory) |" >> results.md
          echo "| Secret Scan (gitleaks) | ${{ needs.gitleaks.result }} (advisory) |" >> results.md
          echo "" >> results.md

          FAILED=false
          for result in \
            "${{ needs.build-test.result }}" \
            "${{ needs.sbom.result }}" \
            "${{ needs.publish-smoke.result }}" \
            "${{ needs.update-loop.result }}" \
            "${{ needs.codeql.result }}" \
            "${{ needs.skill-docs-gate.result }}" \
            "${{ needs.ts-gates.result }}" \
            "${{ needs.capture-windows.result }}" \
            "${{ needs.tray-rust.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              FAILED=true
              break
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "## Gate FAILED" >> results.md
            echo "" >> results.md
            echo "One or more required jobs failed or were cancelled." >> results.md
            cat results.md
            exit 1
          fi

          echo "## Gate PASSED" >> results.md
          echo "" >> results.md
          echo "All required checks passed." >> results.md
          cat results.md

      - name: Upload gate results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-results
          path: results.md
          retention-days: 14
