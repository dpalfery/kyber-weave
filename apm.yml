name: kyber-weave
version: 0.1.1
description: >-
  Governance for the artifacts that shape agent behaviour. Ships the
  kyber-weave-docs skill, which authors and retrofits repository documentation
  to the Kyber-Weave ontology.
author: dpalfery

# Pinned deliberately. Left unset, APM auto-detects targets from the harness
# folders present in the repository, resolves to 'all', and `apm compile` then
# writes AGENTS.md, CLAUDE.md, GEMINI.md, .github/copilot-instructions.md and a
# file per harness — overwriting the hand-authored AGENTS.md files in this tree.
#
# 'agent-skills' scopes compile to .agents/skills/, which produces no compile
# output at all, so those files stay hand-authored.
#
# This does not constrain consumers: --target outranks apm.yml in APM's
# resolution chain, and `kyber-weave docs init` always passes it explicitly.
targets:
  - agent-skills

dependencies:
  # Deliberately empty: this repository is the package, not a consumer of it. A
  # self-entry here makes `apm install dpalfery/kyber-weave` abort on a circular
  # dependency in every consuming repo (#285), which is how docs init's skill
  # deployment broke. Pinned by ApmManifestGuardTests.
  apm: []
  mcp: []
includes: auto
scripts: {}
