# The 32 shipped Arbiter rules. Ids are permanent: suppressions, baselines and
# code-scanning alerts key on them, so a rule is never renumbered or reused.
#
#The step-0 predicate set is closed (all, any, not, exists, equals, in, matches,
# subset-of, intersects, count). An operand that names a fact the rule's trigger
# supplies is a reference; any other string is a literal.
#
# The rule that shapes every rule below (ADR 0072): step 0 decides only what the machine
# produces itself (git diffs, files on disk, the harness payload, the embedded catalog) and
# the answers that let a dispatch proceed. A judgment that rests on reading agent-written
# prose is a step-1 question to the decision model, with a confidence floor. An answer the
# Arbiter cannot reach (no clause matched, provider none, an error, a timeout, a floor not
# met) is undecidable, and undecidable allows and is logged in every family. Only a
# confident violating answer, or a machine fact, escalates.
#
# Two answers are decided outside step 0 and left for the runtime evaluator, which
# joins evidence the closed predicates cannot express:
# - KW-ARB-GATE-CORROBORATED-001 joins gate output to finding.file:line;
# - KW-ARB-QUOTE-001 elsewhere/absent compare excerpt text beyond scalar equality.
# Both still declare their answers and effects here, so validation covers them.
rules:
  # Step 0 allows a dispatch whose named plan was found on disk and parsed into tasks. Anything
  # short of that (no PLAN_FILE header, a path written loosely, a plan the parser read no tasks
  # from) is a reading of prose, so the model is asked whether the dispatch names a plan at all.
  - id: KW-ARB-PLAN-001
    trigger: delegate
    question: Does this dispatch name the plan or specification file its work comes from?
    answers: [has-tasks, names-plan, no-plan]
    decide:
      - when: { all: [{ fact: plan.tasks.count, exists: true }, { not: { fact: plan.tasks.count, equals: 0 } }] }
        answer: has-tasks
    ask:
      type: choice
      state: { dispatch: delegation.head, plan-file: delegation.plan-file-raw, plan-file-found-on-disk: plan.exists }
      criteria:
        names-plan: The dispatch names a plan or specification file that the worker's task comes from.
        no-plan: The dispatch names no plan or specification file anywhere; it gives the worker the work with no plan behind it.
      confidence-at-least: 0.8
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { has-tasks: allow, names-plan: allow, no-plan: escalate }

  - id: KW-ARB-SCOPE-001
    trigger: delegate
    question: Is the work this dispatch asks for one of the plan's tasks?
    answers: [in-task-files, beyond-files, no-task-files, in-plan, not-in-plan]
    # A TASK that names a task the plan holds is a lookup; whether the dispatch's work is one of
    # the plan's tasks when the lookup missed is a reading of prose. Asked only once a plan with
    # tasks was read, so a dispatch with no plan is judged by KW-ARB-PLAN-001 alone.
    decide:
      - when: { all: [{ fact: plan.task, exists: true }, { fact: plan.task.files, count: 0 }] }
        answer: no-task-files
      - when: { all: [{ fact: plan.task, exists: true }, { fact: delegation.paths, subset-of: plan.task.files }] }
        answer: in-task-files
      - when: { fact: plan.task, exists: true }
        answer: beyond-files
    ask:
      type: choice
      state: { dispatch: delegation.head, task: delegation.task-raw, plan-tasks: plan.task-list }
      criteria:
        in-plan: The work the dispatch asks for is one of the plan's tasks, whatever name or number the dispatch uses for it.
        not-in-plan: The dispatch asks for work that none of the plan's tasks describes.
      confidence-at-least: 0.8
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
      when: KW-ARB-PLAN-001=has-tasks
    effects: { in-task-files: allow, beyond-files: allow, no-task-files: allow, in-plan: allow, not-in-plan: escalate }

  - id: KW-ARB-SCOPE-002
    trigger: delegate
    question: Does the delegation ask for work the plan task does not describe?
    answers: [no-task, within-task, adds-work, unrelated]
    # With no plan task found there is nothing to compare against, so the question is not asked.
    decide:
      - when: { fact: plan.task, exists: false }
        answer: no-task
    ask:
      type: choice
      state: { task: plan.task.text, delegation: delegation.prompt }
      criteria:
        within-task: Every piece of work the delegation asks for is described by the task.
        adds-work: The delegation asks for work the task does not describe.
        unrelated: The delegation does not concern this task.
      confidence-at-least: 0.8
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { no-task: allow, within-task: allow, adds-work: escalate, unrelated: escalate }

  - id: KW-ARB-READY-001
    trigger: delegate
    question: Has every task this one depends on finished?
    answers: [no-task, ready, waiting, overlaps-in-flight, unknown-dependency, returns-unobservable, returns-unread]
    # Completion read from a return's RESULT: marker is a reading of the worker's prose, so a
    # dependency the markers do not show complete is asked about, with the stored report tails.
    # With no stored reports to read (the plan was named loosely, so its returns cannot be
    # found), the question would judge an absence it cannot see, so it is not asked.
    decide:
      - when: { fact: plan.task, exists: false }
        answer: no-task
      - when: { fact: plan.task.files, intersects: ledger.in-flight.paths }
        answer: overlaps-in-flight
      - when: { fact: plan.task.depends-on, exists: false }
        answer: ready
      - when: { fact: plan.task.depends-on, count: 0 }
        answer: ready
      - when: { fact: plan.task.depends-on, subset-of: ledger.completed-tasks }
        answer: ready
      - when: { fact: harness.observes-returns, equals: false }
        answer: returns-unobservable
      - when: { fact: ledger.task-returns, exists: false }
        answer: returns-unread
    ask:
      type: choice
      state: { depends-on: plan.task.depends-on, completed-by-markers: ledger.completed-tasks, returned-reports: ledger.task-returns, dispatch: delegation.head }
      criteria:
        ready: Every task in depends-on is finished, as its returned report or the dispatch shows.
        waiting: At least one task in depends-on has not finished, or has no returned report at all.
      confidence-at-least: 0.8
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    # unknown-dependency (a dependency naming no task in the artifact) needs plan
    # membership the delegate trigger does not supply; it stays declared so the
    # runtime evaluator can answer it once plan parsing reports it.
    effects: { no-task: allow, ready: allow, waiting: escalate, overlaps-in-flight: escalate, unknown-dependency: escalate, returns-unobservable: allow, returns-unread: allow }

  - id: KW-ARB-OWNER-001
    trigger: delegate
    question: Does the task name the dispatch target as the specialist to do it?
    answers: [no-task, owner, not-owner, no-mapping]
    # The skills a task names are read from plan prose, so a target missing from that list is
    # asked about (a different spelling of the same specialist is common) rather than blocked.
    decide:
      - when: { fact: plan.task, exists: false }
        answer: no-task
      - when: { fact: delegation.target, in: plan.task.skills }
        answer: owner
      - when: { all: [{ fact: delegation.target, equals: test-dev }, { fact: plan.development-mode, equals: test-first }] }
        answer: owner
      - when: { any: [{ fact: plan.task.skills, exists: false }, { fact: plan.task.skills, count: 0 }] }
        answer: no-mapping
    ask:
      type: choice
      state: { task: plan.task.text, skills: plan.task.skills, target: delegation.target }
      criteria:
        owner: The task names the target as its specialist, possibly spelled or abbreviated differently.
        not-owner: The task names only other specialists, and none of them is the target.
      confidence-at-least: 0.8
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    # The file-kind map below refines no-mapping at runtime, first match wins.
    effects: { no-task: allow, owner: allow, not-owner: escalate, no-mapping: allow }

  - id: KW-ARB-OWNER-002
    trigger: delegate
    question: Which specialist in the caller's implementation roster owns this task?
    answers: [target, other]
    ask:
      type: choice
      state: { task: plan.task.text, roster: roster.descriptions, target: delegation.target }
      criteria:
        target: The choice equals delegation.target.
        other: Another specialist owns this task.
      confidence-at-least: 0.8
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
      when: KW-ARB-OWNER-001=no-mapping
    effects: { target: allow, other: escalate }

  - id: KW-ARB-MODE-001
    trigger: delegate
    question: In test-first mode, were failing tests for this task written before this implementation dispatch?
    answers: [no-task, not-required, present, missing, returns-unobservable, returns-unread]
    # RED evidence read from a RED_EVIDENCE: marker is a reading of the test-dev report, so when
    # the marker is not there the model reads the stored report tails and the dispatch.
    decide:
      - when: { fact: plan.task, exists: false }
        answer: no-task
      - when: { fact: plan.development-mode, equals: standard }
        answer: not-required
      - when: { fact: delegation.target, equals: test-dev }
        answer: not-required
      - when: { fact: delegation.target-profile, equals: documentation }
        answer: not-required
      - when: { fact: plan.test-contract.row, equals: Not applicable }
        answer: not-required
      - when: { fact: ledger.red-evidence, exists: true }
        answer: present
      - when: { fact: harness.observes-returns, equals: false }
        answer: returns-unobservable
      - when: { fact: ledger.task-returns, exists: false }
        answer: returns-unread
    ask:
      type: choice
      state: { task: plan.task.text, returned-reports: ledger.task-returns, dispatch: delegation.head }
      criteria:
        present: A returned report or the dispatch shows failing tests for this task were written and run before this dispatch.
        missing: No returned report and nothing in the dispatch shows that failing tests for this task exist yet.
      confidence-at-least: 0.8
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { no-task: allow, not-required: allow, present: allow, missing: escalate, returns-unobservable: allow, returns-unread: allow }

  - id: KW-ARB-ROSTER-001
    trigger: [delegate, investigate]
    question: Is the target in the caller's delegates-to?
    answers: [listed, not-listed]
    decide:
      - when: { fact: delegation.target, in: roster.caller.delegates-to }
        answer: listed
      - when: { fact: caller, exists: true }
        answer: not-listed
    effects: { listed: allow, not-listed: escalate }

  - id: KW-ARB-DIFF-001
    trigger: delegate.returned
    question: Are all the files this delegation changed part of the work its task describes?
    answers: [out-of-scope, no-task, no-task-files, inside-task, outside-task]
    # The changed paths are git's; the task's file list is plan prose. A changed path the list does
    # not cover is asked about, because a task's file list is rarely exhaustive.
    decide:
      - when: { fact: git.changed-paths.since-dispatch, intersects: plan.out-of-scope }
        answer: out-of-scope
      - when: { fact: plan.task, exists: false }
        answer: no-task
      - when: { fact: plan.task.files, count: 0 }
        answer: no-task-files
      - when: { fact: git.changed-paths.since-dispatch, subset-of: plan.task.files }
        answer: inside-task
    ask:
      type: choice
      state: { task: plan.task.text, task-files: plan.task.files, changed-files: git.changed-paths.since-dispatch }
      criteria:
        inside-task: Every changed file is one the task's work would touch, even where the task's file list does not name it.
        outside-task: At least one changed file has nothing to do with the work the task describes.
      confidence-at-least: 0.8
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { out-of-scope: escalate, no-task: allow, no-task-files: allow, inside-task: allow, outside-task: escalate }

  - id: KW-ARB-PLANNER-001
    trigger: delegate.planner
    question: Does this dispatch ask the planner for planning work?
    answers: [recognised, malformed]
    # Markers and the PLAN_FILE header are agent-written lines, so step 0 only recognises the
    # exact forms. Anything else is asked. Where the planner writes is a machine fact checked on
    # its return by KW-ARB-PLANNER-DIFF-001, so a path here is never blocked on its spelling.
    decide:
      - when: { all: [{ fact: delegation.markers, exists: true }, { fact: delegation.plan-file-rejected, exists: false }, { fact: delegation.plan-file, exists: false }] }
        answer: recognised
      - when: { all: [{ fact: delegation.markers, exists: true }, { fact: delegation.plan-file, matches: config.planning-dirs }] }
        answer: recognised
    ask:
      type: choice
      state: { dispatch: delegation.head, plan-file: delegation.plan-file-raw, planning-dirs: config.planning-dirs }
      criteria:
        recognised: The dispatch asks the planner to assess, write, revise or finalise a plan, specification or todo.
        malformed: The dispatch asks the planner for work that is not planning, such as writing or changing code.
      confidence-at-least: 0.8
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { recognised: allow, malformed: escalate }

  - id: KW-ARB-PLANNER-DIFF-001
    trigger: delegate.planner.returned
    question: Did the planner write only inside the plan, spec and todo directories?
    answers: [inside, outside]
    decide:
      - when: { fact: git.changed-paths.since-dispatch, count: 0 }
        answer: inside
      - when: { fact: git.changed-paths.since-dispatch, subset-of: config.planning-dirs }
        answer: inside
      - when: { fact: git.changed-paths.since-dispatch, exists: true }
        answer: outside
    effects: { inside: allow, outside: escalate }

  - id: KW-ARB-READONLY-001
    trigger: investigate.returned
    question: Did the read-only dispatch leave the tree unchanged?
    answers: [unchanged, changed]
    decide:
      - when: { fact: git.changed-paths.since-dispatch, exists: false }
        answer: unchanged
      - when: { fact: git.changed-paths.since-dispatch, count: 0 }
        answer: unchanged
      - when: { fact: git.changed-paths.since-dispatch, exists: true }
        answer: changed
    effects: { unchanged: allow, changed: escalate }

  - id: KW-ARB-LENS-001
    trigger: lens.spawn
    question: Does the lens apply to this change?
    answers: [applies, not-applicable]
    # A Markdown-only change has no code for these two lenses to judge, which is what
    # their Applicability text says. The set has to be positively Markdown-only to skip:
    # an empty or unreadable set satisfies subset-of vacuously, and on a committed tree
    # the set was empty, so both lenses vanished exactly when per-task commits made a
    # clean tree the normal case. The non-empty clause makes the skip need evidence.
    decide:
      - when: { all: [{ fact: lens.name, equals: correctness }, { not: { fact: review.changed-paths, count: 0 } }, { fact: review.changed-paths, subset-of: ["**/*.md"] }] }
        answer: not-applicable
      - when: { all: [{ fact: lens.name, equals: test-adequacy }, { not: { fact: review.changed-paths, count: 0 } }, { fact: review.changed-paths, subset-of: ["**/*.md"] }] }
        answer: not-applicable
    ask:
      type: noul
      state: { applicability: lens.applicability, diff: review.diff-summary }
      question: Does the lens apply to this change?
      instructions-from: "lens:"
      probability-below: 0.1
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { applies: allow, not-applicable: skip }

  - id: KW-ARB-QUOTE-001
    trigger: lens.returned
    question: Is each finding's excerpt present at its file:line?
    answers: [present, elsewhere, absent]
    decide:
      - when: { fact: finding.excerpt, equals: file.text-at-line }
        answer: present
    effects: { present: allow, elsewhere: annotate, absent: annotate }

  - id: KW-ARB-PREEX-001
    trigger: lens.returned
    question: Is the excerpt inside a changed hunk?
    answers: [in-hunk, outside-hunk]
    decide:
      - when: { all: [{ fact: finding.changed-lines, exists: true }, { fact: finding.line, in: finding.changed-lines }] }
        answer: in-hunk
      - when: { all: [{ fact: finding.changed-lines, exists: true }, { not: { fact: finding.line, in: finding.changed-lines } }] }
        answer: outside-hunk
    effects: { in-hunk: allow, outside-hunk: annotate }

  - id: KW-ARB-CLAIM-001
    trigger: refute.spawn
    question: Do the quoted code and its surroundings support the finding's claim?
    answers: [supports, contradicts, says_nothing]
    ask:
      type: choice
      state: { claim: finding.claim, excerpt: finding.excerpt, surroundings: file.surroundings }
      criteria:
        supports: The quoted code and its surroundings support the finding's claim.
        contradicts: The quoted code contradicts the finding's claim.
        says_nothing: The quoted code says nothing about the finding's claim.
      confidence-at-least: 0.9
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { supports: verify, contradicts: allow, says_nothing: allow }

  - id: KW-ARB-GATE-CORROBORATED-001
    trigger: refute.spawn
    question: Does a failed gate already corroborate the finding?
    answers: [corroborated, not-corroborated]
    effects: { corroborated: verify, not-corroborated: allow }

  - id: KW-ARB-GATE-001
    trigger: gate.select
    question: Does any changed path match the gate's applies-when.paths?
    answers: [applies, not-applicable]
    decide:
      - when: { fact: review.changed-paths, intersects: gate.applies-when.paths }
        answer: applies
      - when: { fact: review.changed-paths, exists: true }
        answer: not-applicable
    effects: { applies: applies, not-applicable: not-applicable }

  # The read guard is advisory wherever a harness has hooks, so on a harness whose
  # dispatch hook fires this rule is the enforcement the guard cannot be. The fact it
  # reads is the dispatch body with the routing header already removed, because
  # PLAN_FILE names the plan by design and a rule reading the raw prompt would escalate
  # every dispatch in a run. Closeout is the one dispatch that must read the plan, so a
  # documentation-profile target is exempt. Where no dispatch hook runs, no rule runs:
  # that is an install property, and no predicate here can state it.
  - id: KW-ARB-PLANREAD-001
    trigger: delegate
    question: Does the dispatch tell the worker to open or read a plan, specification or todo file?
    answers: [names-plan, mentions-only, no-plan, closeout]
    # The path detector reads prose, so a named planning path is asked about: a dispatch may
    # mention its plan to say which task it serves without sending the worker into it.
    decide:
      - when: { fact: delegation.target-profile, equals: documentation }
        answer: closeout
      - when: { any: [{ fact: delegation.planning-paths, exists: false }, { fact: delegation.planning-paths, count: 0 }] }
        answer: no-plan
    ask:
      type: choice
      state: { dispatch: delegation.body-head, planning-paths: delegation.planning-paths }
      criteria:
        names-plan: The dispatch tells the worker to open, read or follow one of the planning-paths files.
        mentions-only: The dispatch mentions a planning-paths file only to say which plan or task the work serves.
      confidence-at-least: 0.8
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { names-plan: escalate, mentions-only: allow, no-plan: allow, closeout: allow }

  # A dispatch claims what the worker will do; the digest that comes back carries a
  # `TASK_GATE:` line claiming a gate run happened. That line is the worker's own word,
  # so the rule checks it against the report file the line names rather than reading the
  # claim. Joining the claimed status to the report's gates is a two-fact comparison the
  # closed predicate set cannot express, so GateReportFacts makes it and answers the fact:
  # true when the report corroborates the claim, false when it contradicts it, absent
  # when the line, the path or the file cannot be read. A contradiction is a machine
  # finding and escalates. An absent fact is a line the parser could not read, so the
  # model reads the report tail and the raw line instead, and only a confident "no gate
  # was run" escalates. A return with no text at all cannot be judged and allows. Where a
  # harness cannot observe returns the post-dispatch hook never fires and the rule cannot
  # run; the end-of-run gates catch that case instead.
  - id: KW-ARB-GATE-REPORT-001
    trigger: delegate.returned
    question: Does the worker's report say it ran the task gate on its changes?
    answers: [verified, disagrees, no-report, ran-gate, missing]
    decide:
      - when: { fact: gate.report.agrees, equals: true }
        answer: verified
      - when: { fact: gate.report.agrees, equals: false }
        answer: disagrees
      - when: { fact: delegation.returned-tail, exists: false }
        answer: no-report
    ask:
      type: choice
      state: { report: delegation.returned-tail, task-gate-line: gate.report.claim }
      criteria:
        ran-gate: The report says the worker ran the task gate on its changes, whatever words or format it uses.
        missing: The report never mentions running the task gate.
      confidence-at-least: 0.8
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { verified: allow, disagrees: escalate, no-report: allow, ran-gate: allow, missing: escalate }

  # A change with no code in it has nothing for these six lenses to judge. The skip needs
  # positive evidence: every changed path must be one the git read marked no-code, and the
  # set must be non-empty, so an absent or empty set stays undecidable and the lens runs.
  # Security, documentation-accuracy and blast-radius-revertibility are never listed here.
  - id: KW-ARB-LENS-002
    trigger: lens.spawn
    question: Is this lens one that has nothing to judge in a change with no code in it?
    answers: [no-code-change]
    decide:
      - when:
          all:
            - { fact: lens.name, in: [correctness, test-adequacy, performance, di-composition, duplicate-implementation, model-placement] }
            - { not: { fact: review.changed-paths, count: 0 } }
            - { fact: review.changed-paths, subset-of: review.no-code-change-paths }
        answer: no-code-change
    effects: { no-code-change: skip }

  # Model targeting on a delegate.model dispatch. The difficulty question asks how hard the
  # task is; an answer retargets to that difficulty's profile only when the classifier is at
  # least 0.8 sure, and below the floor the answer is undecidable and the dispatch keeps its model.
  # Mode off disables the rule, shadow records it without effect, and enforce lets it gate.
  - id: KW-ARB-DIFFICULTY-001
    trigger: delegate.model
    question: "How hard is this task: easy, standard or hard?"
    answers: [easy, standard, hard]
    ask:
      type: choice
      state: { task: plan.task.text, files: plan.task.files, file-kinds: plan.task.file-kinds }
      criteria:
        easy: A small, local change with one obvious path.
        standard: A change with several files or a non-obvious path, but no cross-cutting risk.
        hard: A change that spans layers, alters contracts, or needs careful design.
      confidence-at-least: 0.8
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { easy: retarget, standard: retarget, hard: retarget }

  # Model targeting on a retry. Step 0 decides from the ledger alone, in order: a harness that
  # does not observe returns cannot prove the attempt failed; a first attempt, or one that passed,
  # has nothing to climb from; a failed attempt whose profile was never recorded cannot be
  # climbed from; a failed attempt already on the top rung has nowhere higher to go. Only a
  # failed attempt below the top steps up. Every answer except step-up keeps the model.
  - id: KW-ARB-LADDER-001
    trigger: delegate.model
    question: Did the previous attempt at this task fail on a profile below the top of the ladder?
    answers: [returns-unobservable, first-attempt, profile-unrecorded, top-of-ladder, step-up]
    decide:
      - when: { fact: harness.observes-returns, equals: false }
        answer: returns-unobservable
      - when: { not: { fact: model-targeting.prior-result, equals: fail } }
        answer: first-attempt
      - when: { fact: model-targeting.prior-profile, exists: false }
        answer: profile-unrecorded
      - when: { fact: model-targeting.ladder.next, exists: false }
        answer: top-of-ladder
      - when: { fact: model-targeting.ladder.next, exists: true }
        answer: step-up
    effects:
      returns-unobservable: keep
      first-attempt: keep
      profile-unrecorded: keep
      top-of-ladder: keep
      step-up: retarget

  # The nitpick filter reads one lens finding. A Critical finding, or one a failed gate
  # already corroborates, is substantive without a question. Every other finding is asked
  # once; only a confident nitpick drops it. Shipped in shadow: the drop is logged, and the
  # host still sees the finding, until the calibration run has been read.
  - id: KW-ARB-NITPICK-001
    trigger: lens.returned
    question: Is this lens finding a nitpick, or a substantive defect?
    answers: [substantive, nitpick, unsure]
    shadow: true
    decide:
      - when:
          any:
            - { fact: finding.severity, equals: Critical }
            - { fact: finding.gate-corroborated, equals: true }
        answer: substantive
    ask:
      type: choice
      state: { claim: finding.excerpt }
      criteria:
        substantive: The finding names a defect that changes behaviour, correctness or safety.
        nitpick: The finding is about style, naming or preference and changes no behaviour.
        unsure: The finding cannot be classed as either from the text given.
      confidence-at-least: 0.85
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { substantive: allow, nitpick: drop, unsure: allow }

  # A refutation of a finding the nitpick filter dropped is not worth a refuter. It follows
  # the filter's shadow state, so both rules are shipped in shadow together.
  - id: KW-ARB-NITPICK-002
    trigger: refute.spawn
    question: Did the nitpick filter drop this finding?
    answers: [dropped]
    shadow: true
    decide:
      - when: { fact: finding.dropped, equals: true }
        answer: dropped
    effects: { dropped: verify }

  # A refutation of a finding that repeats an earlier finding of the same review is not worth a refuter. The
  # candidates are the review's earlier findings on the same file within 20 lines (at most three, oldest first).
  # They travel in one batch, and the first candidate answered same-defect at or above the floor names the
  # duplicate. Shipped in shadow: the duplicate is logged, and the refuter still runs, until calibration is read.
  - id: KW-ARB-DUP-001
    trigger: refute.spawn
    question: Does an earlier finding of this review name the same defect as the refuted finding?
    answers: [same-defect, different-defect]
    shadow: true
    ask:
      type: choice
      for-each: review.prior-findings
      state: { claim: finding.excerpt, prior: candidate.text }
      criteria:
        same-defect: "The earlier finding describes the same defect at the same place as the refuted finding."
        different-defect: "The earlier finding describes a different defect, or the same place for another reason."
      confidence-at-least: 0.9
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { same-defect: duplicate, different-defect: allow }

  # A bug-crusher investigate of a defect the Arbiter judges trivial is answered with the substitute report and
  # the investigator is not spawned. A defect that needs the architect keeps the investigate. Shipped in shadow:
  # the answer is logged, and the investigator still runs, until calibration is read.
  - id: KW-ARB-TRIAGE-001
    trigger: triage.shortcut
    question: "Is this defect a trivial single-site fix that needs no architect?"
    answers: [trivial, needs-architect]
    shadow: true
    ask:
      type: choice
      state: { defect: defect.report }
      criteria:
        trivial: "The defect is a single-site fault with an obvious local fix in one file."
        needs-architect: "The defect spans sites, needs a design choice, or the cause is not clear from the report."
      confidence-at-least: 0.9
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { trivial: answer, needs-architect: keep }

  # A conductor's intake for a plan or a spec is answered with the recommendation and the planner is not spawned.
  # Only the planner dispatch that carries the INTAKE: marker derives this shortcut. Shipped in shadow.
  - id: KW-ARB-INTAKE-001
    trigger: intake.shortcut
    question: "Does this request call for a written plan or a written specification?"
    answers: [plan, spec]
    shadow: true
    ask:
      type: choice
      state: { request: intake.request }
      criteria:
        plan: "The request is a bounded change with clear scope that a plan can carry."
        spec: "The request is a feature with requirements that need a specification first."
      confidence-at-least: 0.9
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { plan: answer, spec: answer }

  # A docs-dev dispatch that declares no documentation change is answered without spawning docs-dev. A change that
  # touches a governed path always keeps the dispatch, and the provider is never asked. Shipped in shadow.
  - id: KW-ARB-DOCIMPACT-001
    trigger: docs-impact.shortcut
    question: "Does this change need no documentation change?"
    answers: [touches, no-doc-change, doc-change, unknown]
    shadow: true
    decide:
      - when: { fact: docs.governed-paths-changed, equals: true }
        answer: touches
      - when: { fact: docs.governed-paths-changed, exists: false }
        answer: unknown
    ask:
      type: choice
      state: { changed: review.changed-paths }
      criteria:
        no-doc-change: "No governed document describes the changed paths, so no documentation needs to change."
        doc-change: "A governed document describes the changed paths and would need to change."
      confidence-at-least: 0.9
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { touches: keep, unknown: keep, no-doc-change: answer, doc-change: keep }

  # A rework dispatch whose failure repeats the failure of the same cluster is advised, never denied. The first
  # failure of a cluster is only recorded. Shipped in shadow: the advisory is logged until calibration is read.
  - id: KW-ARB-FAILURE-001
    trigger: delegate.failure
    question: "Is the current failure the same failure as the previous attempt of this cluster?"
    answers: [same, different, first]
    shadow: true
    decide:
      - when: { fact: failure.previous-text, exists: false }
        answer: first
    ask:
      type: choice
      state: { previous: failure.previous-text, current: failure.current-text }
      criteria:
        same: "The current failure reports the same error at the same place as the previous attempt."
        different: "The current failure reports a different error, or the same place for another reason."
      confidence-at-least: 0.85
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { same: same-failure, different: allow, first: allow }

  # Section trimming: asks, for each candidate section of a document, whether the task needs it. Only a
  # confident not-relevant answer trims a section; any unsure answer keeps every section. Shipped in shadow: the
  # answer is logged until calibration is read.
  - id: KW-ARB-TRIM-001
    trigger: sections.select
    question: "Does this section of the document bear on the task?"
    answers: [relevant, not-relevant]
    shadow: true
    ask:
      type: choice
      for-each: section.candidates
      state: { task: task.text, section: candidate.text }
      criteria:
        relevant: "The section describes behaviour, steps or facts the task touches."
        not-relevant: "The section does not bear on the task, so the worker does not need it to do the task."
      confidence-at-least: 0.9
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { relevant: keep, not-relevant: advise }

  # Bot review comment triage: classifies one bot comment against the code at the cited line as it is now.
  # A nitpick or an already-fixed comment is advised; any unsure answer keeps the comment real. Shipped in shadow until
  # calibration is read.
  - id: KW-ARB-COMMENT-001
    trigger: comment.triage
    question: "Is this bot review comment a real defect, a nitpick, or already fixed in the current code?"
    answers: [real, nitpick, already-fixed]
    shadow: true
    ask:
      type: choice
      state: { comment: comment.body, code: file.text-at-line }
      criteria:
        real: "The code at the cited line has the defect the comment describes."
        nitpick: "The comment is a style or preference point that does not change behaviour or correctness."
        already-fixed: "The code at the cited line no longer has the defect the comment describes."
      confidence-at-least: 0.85
      tuned-for: [jev-1.13.0, jev-1.13-free, jev-1.14.0, typesafe/jev-1.13, typesafe/jev-1.14]
    effects: { real: keep, nitpick: advise, already-fixed: advise }

# The OWNER-001 file-kind map, evaluated first match wins. The order is the
# decision: specific owners precede the documentation and C# catch-alls.
owner-file-kind-map:
  - patterns: ["**/*.tsx", "**/*.jsx"]
    owner: react-dev
  - patterns: ["**/src-tauri/**", "**/*.rs"]
    owner: tauri-dev
  - patterns: ["**/*.py", "**/pyproject.toml", "**/requirements*.txt"]
    owner: python-dev
  - patterns: [".github/workflows/**", "**/Dockerfile"]
    owner: github-devops
  - patterns: ["**/*.sql", "**/*.sqlproj"]
    owner: sql-database-architect
  - patterns: ["**/Migrations/**", "**/*Repository.cs"]
    owner: dal-dev
  - patterns: ["**/*.xaml"]
    owner: maui-dev
  - patterns: ["**/Pulumi.yaml", "**/Pulumi.*.yaml"]
    owner: pulumi-dev
  - patterns: ["tests/**", "**/*.test.*", "**/*.spec.*", "**/*Tests.cs"]
    owner: test-dev
  - patterns: ["**/*.md"]
    owner: docs-dev
  - patterns: ["**/*.cs"]
    owner: csharp-dev

# The LENS-001 step-0 per-lens path table. It holds only path conditions the
# lens's own Applicability section states: documentation-only changes skip the
# two lenses that say so. Every other lens defers to step 1.
lens-paths:
  - lens: correctness
    not-applicable-when-all-match: ["**/*.md"]
  - lens: test-adequacy
    not-applicable-when-all-match: ["**/*.md"]
